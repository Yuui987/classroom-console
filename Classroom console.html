  --wood-1:#dba066;
  --wood-2:#a96b34;
  --paper:#fffaf0;
  --paper-2:#fbeecc;
  --paper-deep:#f0dcac;
  --ink:#3b2a1a;
  --ink-dim:#7d6851;
  --ink-faint:#ab936f;
  --line:rgba(59,42,26,0.15);
  --line-strong:rgba(59,42,26,0.32);

  --red:#e2524d;
  --red-light:#ef8985;
  --red-dark:#b83b36;
  --red-dim:rgba(226,82,77,0.14);
  --green:#3fac72;
  --green-light:#6cc898;
  --green-dark:#277a4f;
  --green-dim:rgba(63,172,114,0.16);
  --gold:#e3a83c;
  --gold-light:#f0c877;
  --gold-dark:#b9822a;
  --gold-dim:rgba(227,168,60,0.18);
  --blue:#5e9be0;
  --blue-dim:rgba(94,155,224,0.16);

  --radius-sm:9px;
  --radius-md:15px;
  --radius-lg:24px;
  --shadow-soft:0 8px 22px rgba(59,42,26,0.16);
  --shadow-lift:0 18px 40px rgba(59,42,26,0.3);
  --font-display:'Noto Serif TC',serif;
  --font-ui:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
  --header-h:66px;
  --panel-w:376px;
  --panel-collapsed-w:46px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    linear-gradient(rgba(255,250,240,0.14), rgba(255,250,240,0.22)),
    var(--bg-image) center/cover no-repeat fixed,
    linear-gradient(155deg, var(--wood-1), var(--wood-2) 78%);
  color:var(--ink);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  padding:10px;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold-dim);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(59,42,26,0.22);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:rgba(59,42,26,0.36);}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;}
}

#app{
  height:100%;display:flex;flex-direction:column;
  background:var(--paper-2);
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 30px 70px rgba(35,22,8,0.45), 0 0 0 1px rgba(255,255,255,0.35) inset;
}

.app-header{
  height:var(--header-h);
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 20px;
  background:var(--paper);
  border-bottom:3px solid var(--paper-deep);
  box-shadow:0 3px 0 rgba(59,42,26,0.05);
  z-index:60;
  position:relative;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;position:relative;}
.brand-mark{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(150deg, var(--red-light), var(--red) 60%, var(--red-dark));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-display);font-weight:900;font-size:18px;
  border:2px solid rgba(255,255,255,0.5);
  box-shadow:var(--shadow-soft);
  flex:0 0 auto;
}
.brand-text{min-width:0;}
.brand-class-btn{
  display:flex;align-items:center;gap:6px;border:none;background:transparent;cursor:pointer;
  font-size:15.5px;font-weight:800;letter-spacing:.1px;color:var(--ink);
  padding:2px 0;max-width:38vw;
}
.brand-class-btn span.txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-class-btn svg{width:13px;height:13px;color:var(--ink-faint);flex:0 0 auto;transition:transform .15s ease;}
.brand-class-btn:hover{color:var(--red-dark);}
.brand-class-btn:hover svg{color:var(--red-dark);}
.brand-class-btn.open svg{transform:rotate(180deg);}
.brand-sub{font-size:11px;color:var(--ink-faint);letter-spacing:.5px;text-transform:uppercase;font-weight:700;}

.class-dropdown{
  position:absolute;top:calc(100% + 10px);left:0;
  width:300px;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius-md);
  box-shadow:var(--shadow-lift);padding:10px;display:none;z-index:70;
}
.class-dropdown.open{display:block;}
.cd-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;}
.cd-item:hover{background:var(--paper-2);}
.cd-item.active{background:var(--green-dim);border-color:rgba(63,172,114,0.35);}
.cd-item .cd-icon{width:30px;height:30px;border-radius:9px;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--gold-dark);font-weight:800;font-size:13px;}
.cd-item.active .cd-icon{background:var(--green);color:#fff;}
.cd-item .cd-name{flex:1;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cd-item .cd-count{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);}
.cd-divider{height:1px;background:var(--line);margin:8px 2px;}
.cd-action{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-dim);border:none;background:transparent;width:100%;text-align:left;}
.cd-action:hover{background:var(--paper-2);color:var(--ink);}
.cd-action svg{width:14px;height:14px;}

.mode-tabs{display:flex;gap:4px;background:var(--paper-2);border:1px solid var(--line);border-radius:13px;padding:4px;margin:0 auto;flex:0 0 auto;}
.mode-tab{border:none;background:transparent;color:var(--ink-dim);padding:8px 16px;border-radius:10px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;cursor:pointer;transition:all .15s ease;white-space:nowrap;}
.mode-tab svg{width:16px;height:16px;}
.mode-tab.active{background:var(--red);color:#fff;box-shadow:var(--shadow-soft);}
.mode-tab:hover:not(.active){color:var(--ink);background:rgba(255,255,255,0.6);}

.header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-faint);padding:6px 10px;border-radius:20px;border:1px solid var(--line);font-family:var(--font-mono);background:var(--paper-2);}
.sync-pill svg{width:13px;height:13px;}
.sync-pill.saving{color:var(--gold-dark);border-color:rgba(227,168,60,0.4);}
.sync-pill.error{color:var(--red-dark);border-color:rgba(226,82,77,0.4);}
.sync-pill.signedout{color:var(--red-dark);border-color:rgba(226,82,77,0.4);cursor:pointer;}
.sync-pill.signedout:hover{background:var(--red-dim);}
.icon-btn{height:38px;min-width:38px;border-radius:11px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s ease;position:relative;}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:hover{background:var(--paper-deep);color:var(--ink);border-color:var(--line-strong);}
.icon-btn.labeled{width:auto;padding:0 14px;gap:8px;font-size:13px;font-weight:700;}

.app-main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr var(--panel-w);gap:18px;padding:18px;transition:grid-template-columns .28s ease;}
.app-main.panel-collapsed{grid-template-columns:1fr var(--panel-collapsed-w);}

.board-area{
  position:relative;border-radius:var(--radius-lg);border:5px solid var(--paper-deep);
  background:radial-gradient(circle at 50% 42%, rgba(255,255,255,0.55), transparent 55%), var(--paper-2);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.5), var(--shadow-lift);
  overflow:hidden;min-height:0;
}
.board-area::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(59,42,26,0.05) 1.4px, transparent 1.4px);background-size:24px 24px;opacity:.55;}
.ring-track-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.ring-layer{position:absolute;inset:0;}

.tile{
  position:absolute;top:0;left:0;width:100px;height:128px;border-radius:16px;background:var(--paper);border:1px solid var(--line-strong);
  display:flex;flex-direction:column;overflow:hidden;transform:translate(-50%,-50%);
  transition:box-shadow .25s ease, border-color .25s ease, opacity .25s ease, outline-color .25s ease, width .2s ease, height .2s ease;
  cursor:pointer;user-select:none;box-shadow:0 4px 10px rgba(59,42,26,0.18);
  container-type:inline-size;
}
.tile-band{height:44%;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;}
.tile-tier-icon{width:calc(clamp(15px,34cqw,64px) * var(--tier-mul,1));height:calc(clamp(15px,34cqw,64px) * var(--tier-mul,1));object-fit:contain;}
.tile-num{font-family:var(--font-mono);font-size:clamp(7px,12cqw,20px);color:rgba(59,42,26,0.55);font-weight:700;position:absolute;top:4%;left:6%;}
.tile-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:3px 4px;min-width:0;width:100%;}
.tile-name{font-size:clamp(8px,14.5cqw,28px);font-weight:800;color:var(--ink);line-height:1.15;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tile-score{font-family:var(--font-mono);font-size:clamp(6.5px,12cqw,20px);color:var(--ink-faint);font-weight:700;}

.tile.st-answered{outline:2.5px solid var(--green-light);outline-offset:1px;}
.tile.st-excluded{opacity:.4;}
.tile.st-excluded .tile-name{text-decoration:line-through;}

.tile.flash{border-color:var(--gold);box-shadow:0 0 0 2px rgba(227,168,60,0.6), 0 0 20px rgba(227,168,60,0.4);transform:translate(-50%,-50%) scale(1.05);}
.tile.selected{z-index:5;transform:translate(-50%,-50%) scale(1.18);border-color:var(--red);box-shadow:0 0 0 2px rgba(226,82,77,0.6), 0 0 0 7px rgba(226,82,77,0.16), 0 14px 26px rgba(59,42,26,0.35);animation:tile-pop .42s cubic-bezier(.2,1.4,.4,1);}
@keyframes tile-pop{0%{transform:translate(-50%,-50%) scale(.85);}60%{transform:translate(-50%,-50%) scale(1.24);}100%{transform:translate(-50%,-50%) scale(1.18);}}

.tile.tile-event{align-items:center;justify-content:center;text-align:center;gap:6px;background:linear-gradient(160deg, var(--red-light), var(--red) 65%, var(--red-dark));border-color:var(--red-dark);}
.tile.tile-event .tile-emoji{font-size:clamp(14px,32cqw,58px);}
.tile.tile-event .tile-name{color:#fff;font-size:clamp(7.5px,13.5cqw,24px);}

.tile.group-tile{width:158px;height:80px;border-radius:17px;flex-direction:column;justify-content:center;gap:clamp(4px,5cqw,16px);padding:clamp(6px,6cqw,20px) clamp(8px,8cqw,24px);align-items:stretch;background:var(--paper);}
.gt-row1{display:flex;align-items:center;gap:9px;min-width:0;}
.gt-row2{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tile.group-tile .g-swatch{width:clamp(8px,8.2cqw,22px);height:clamp(8px,8.2cqw,22px);border-radius:4px;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,0.6);}
.tile.group-tile .g-name{font-size:clamp(8.5px,9.5cqw,30px);font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.tile.group-tile .g-count{font-size:clamp(6.5px,7.3cqw,22px);color:var(--ink-faint);font-family:var(--font-mono);}
.group-tier-icon{width:calc(clamp(12px,15.2cqw,46px) * var(--tier-mul,1));height:calc(clamp(12px,15.2cqw,46px) * var(--tier-mul,1));object-fit:contain;flex:0 0 auto;}

.seal{position:absolute;width:44px;height:44px;border:2.5px solid var(--red);border-radius:9px;color:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:18px;background:rgba(226,82,77,0.08);pointer-events:none;transform:translate(-50%,-50%) rotate(-14deg) scale(2.4);opacity:0;z-index:9;}
.seal.stamp-in{animation:seal-stamp .5s cubic-bezier(.18,1.4,.4,1) forwards;}
@keyframes seal-stamp{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(2.6);}
  55%{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(0.82);}
  75%{transform:translate(-50%,-50%) rotate(-11deg) scale(1.05);}
  100%{opacity:.94;transform:translate(-50%,-50%) rotate(-11deg) scale(1);}
}

.particle{position:absolute;width:7px;height:7px;border-radius:3px;pointer-events:none;z-index:8;animation:particle-burst .65s ease-out forwards;}
@keyframes particle-burst{
  0%{transform:translate(-50%,-50%) translate(0,0) scale(1) rotate(0deg);opacity:1;}
  100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.3) rotate(140deg);opacity:0;}
}

.stage{
  position:absolute;min-width:200px;min-height:160px;
  border-radius:26px;background:var(--paper);border:1px solid var(--line-strong);box-shadow:var(--shadow-lift);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;z-index:6;
  transition:left .2s ease, top .2s ease, width .2s ease, height .2s ease;
  overflow:auto;
}
.stage-idle .eyebrow{font-size:12.5px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase;font-weight:800;margin-bottom:14px;}
.stage-idle h1{font-family:var(--font-display);font-size:clamp(28px,3.4vw,44px);font-weight:900;margin:0 0 8px;}
.stage-idle p{color:var(--ink-dim);font-size:15px;margin:0 0 26px;}

.btn-dice{
  border:none;cursor:pointer;padding:18px 42px;border-radius:18px;
  background:linear-gradient(160deg, var(--red-light), var(--red) 60%, var(--red-dark));
  color:#fff;font-size:19px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:12px;
  box-shadow:0 10px 24px rgba(226,82,77,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn-dice svg{width:24px;height:24px;}
.btn-dice:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(226,82,77,0.5), inset 0 1px 0 rgba(255,255,255,0.35);}
.btn-dice:active{transform:translateY(0px) scale(.98);}
.btn-dice:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.stage-rolling .roll-icon{width:60px;height:60px;color:var(--gold-dark);margin-bottom:16px;animation:spin .55s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.stage-rolling .roll-flicker{font-family:var(--font-display);font-weight:900;font-size:clamp(24px,3vw,38px);color:var(--ink-dim);min-height:1.3em;}
.stage-rolling .roll-label{font-size:13px;color:var(--ink-faint);letter-spacing:1.5px;text-transform:uppercase;margin-top:10px;font-weight:700;}

.result-kicker{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:5px 13px;border-radius:20px;margin-bottom:14px;}
.result-kicker.k-student{color:var(--green-dark);background:var(--green-dim);}
.result-kicker.k-group{color:var(--gold-dark);background:var(--gold-dim);}
.result-kicker.k-challenge{color:var(--blue);background:var(--blue-dim);}
.result-kicker.k-event{color:var(--red-dark);background:var(--red-dim);}
.result-kicker svg{width:14px;height:14px;}

.result-fruit-big{line-height:1;margin-bottom:6px;}
.result-fruit-big img{width:calc(64px * var(--tier-mul,1));height:calc(64px * var(--tier-mul,1));object-fit:contain;}
.result-group-dot{width:16px;height:16px;border-radius:5px;display:inline-block;margin-right:10px;vertical-align:-2px;}
.result-name{font-family:var(--font-display);font-weight:900;font-size:clamp(28px,3.8vw,48px);line-height:1.08;margin:0 0 6px;position:relative;display:inline-block;}
.result-sub{color:var(--ink-dim);font-size:14.5px;margin-bottom:6px;}
.result-challenge-text{font-family:var(--font-display);font-weight:700;font-size:clamp(19px,2.2vw,27px);line-height:1.5;max-width:520px;margin:4px 0 6px;}
.result-event-icon{font-size:44px;margin-bottom:6px;}
.result-event-desc{color:var(--ink-dim);font-size:14.5px;line-height:1.6;max-width:440px;margin-bottom:4px;}

.round-badge{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--gold-dark);background:var(--gold-dim);border:1px solid var(--line);padding:4px 12px;border-radius:20px;margin-bottom:18px;display:inline-flex;align-items:center;gap:6px;min-height:24px;}
.round-badge svg{width:13px;height:13px;}

.stage-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
.act-btn{border:1px solid var(--line-strong);background:var(--paper-2);color:var(--ink);padding:12px 20px;border-radius:13px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .15s ease;}
.act-btn svg{width:16px;height:16px;}
.act-btn:hover{background:var(--paper-deep);transform:translateY(-1px);}
.act-btn.primary{background:linear-gradient(160deg, var(--green-light), var(--green));color:#fff;border:none;box-shadow:0 6px 16px rgba(63,172,114,0.35);}
.act-btn.primary:hover{filter:brightness(1.05);}
.act-btn.danger{color:var(--red-dark);}
.act-btn.danger:hover{background:var(--red-dim);border-color:rgba(226,82,77,0.4);}
.act-btn.ghost{background:transparent;}
.act-btn.small{padding:8px 14px;font-size:13px;border-radius:10px;}

.empty-pool-msg{color:var(--red-dark);font-size:14px;max-width:380px;margin-top:6px;}

.control-panel-wrap{display:flex;flex-direction:row;gap:10px;min-height:0;min-width:0;}
.panel-rail-toggle{
  flex:0 0 auto;width:36px;align-self:stretch;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;
  padding:16px 0;cursor:pointer;color:var(--ink-dim);box-shadow:var(--shadow-soft);
}
.panel-rail-toggle:hover{background:var(--paper-2);color:var(--ink);border-color:var(--line-strong);}
.prt-chevron{width:16px;height:16px;display:flex;transition:transform .25s ease;}
.prt-chevron svg{width:16px;height:16px;transform:rotate(-90deg);}
.app-main.panel-collapsed .prt-chevron svg{transform:rotate(90deg);}
.prt-label{writing-mode:vertical-rl;font-size:11.5px;font-weight:800;letter-spacing:2px;color:var(--ink-faint);}
.control-panel{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;padding-right:2px;transition:opacity .18s ease;}
.app-main.panel-collapsed .control-panel{opacity:0;pointer-events:none;width:0;flex:0 0 0;overflow:hidden;}
.panel-card{border:1px solid var(--line);background:var(--paper);border-radius:var(--radius-md);padding:16px;flex:0 0 auto;box-shadow:var(--shadow-soft);}
.panel-card h3{margin:0 0 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-faint);font-weight:800;display:flex;align-items:center;gap:7px;}
.panel-card h3 svg{width:13px;height:13px;}

.current-card{display:flex;align-items:center;gap:12px;}
.current-avatar{width:54px;height:54px;border-radius:15px;flex:0 0 auto;background:var(--paper-2);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;}
.avatar-tier-icon{width:calc(36px * var(--tier-mul,1));height:calc(36px * var(--tier-mul,1));object-fit:contain;}
.current-avatar .dot{position:absolute;bottom:-3px;right:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--paper);}
.current-info{min-width:0;flex:1;}
.current-name{font-size:16.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.current-meta{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.current-empty{color:var(--ink-faint);font-size:13.5px;}
.round-points{font-family:var(--font-mono);font-weight:800;font-size:15px;color:var(--green-dark);flex:0 0 auto;}

.status-strip{display:flex;justify-content:space-between;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.status-item{text-align:center;flex:1;}
.status-item b{display:block;font-family:var(--font-mono);font-size:15px;color:var(--ink);}
.status-item span{font-size:10.5px;color:var(--ink-faint);}

.score-row{display:flex;gap:8px;}
.score-row .act-btn{flex:1;justify-content:center;}
.score-row .act-btn.plus{font-size:17px;padding:13px;}

.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.qa-btn{border:1px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:11px;padding:11px 8px;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .15s ease;}
.qa-btn svg{width:18px;height:18px;color:var(--red);}
.qa-btn:hover{background:var(--paper-deep);border-color:var(--line-strong);transform:translateY(-1px);}

.panel-card.grow{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;}
.mini-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px;margin-top:2px;}
.mini-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 9px;border-radius:8px;background:var(--paper-2);}
.mini-row .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.mini-tier-icon{width:calc(16px * var(--tier-mul,1));height:calc(16px * var(--tier-mul,1));object-fit:contain;flex:0 0 auto;}
.mini-row .v{font-family:var(--font-mono);color:var(--gold-dark);font-weight:700;flex:0 0 auto;margin-left:8px;}
.mini-rank{width:18px;height:18px;border-radius:50%;background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--ink-faint);margin-right:2px;flex:0 0 auto;}
.mini-empty{color:var(--ink-faint);font-size:12.5px;text-align:center;padding:14px 0;}

.modal-backdrop{position:fixed;inset:0;background:rgba(59,42,26,0.42);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:26px;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius-lg);width:100%;box-shadow:var(--shadow-lift);display:flex;flex-direction:column;max-height:88vh;overflow:hidden;}
.modal.w-xs{max-width:340px;}
.modal.w-sm{max-width:420px;}
.modal.w-md{max-width:620px;}
.modal.w-lg{max-width:920px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);flex:0 0 auto;}
.modal-head h2{margin:0;font-family:var(--font-display);font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px;color:var(--ink);}
.modal-head h2 svg{width:18px;height:18px;color:var(--red);}
.modal-body{padding:20px 22px;overflow-y:auto;}
.modal-close{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.modal-close:hover{background:var(--paper-deep);color:var(--ink);}
.modal-close svg{width:15px;height:15px;}

.settings-body{display:grid;grid-template-columns:172px 1fr;min-height:460px;}
.settings-nav{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:3px;}
.settings-nav button{text-align:left;border:none;background:transparent;color:var(--ink-dim);padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:9px;}
.settings-nav button svg{width:15px;height:15px;flex:0 0 auto;}
.settings-nav button.active{background:var(--green-dim);color:var(--green-dark);}
.settings-nav button:hover:not(.active){background:var(--paper-2);color:var(--ink);}
.settings-pane{padding:20px 22px;overflow-y:auto;}
.settings-pane h4{margin:0 0 4px;font-size:15px;font-weight:800;}
.settings-pane .hint{color:var(--ink-faint);font-size:12.5px;margin:0 0 16px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-dim);margin-bottom:7px;}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;background:var(--paper-2);border:1px solid var(--line-strong);color:var(--ink);padding:10px 12px;border-radius:9px;font-size:14px;}
.field textarea{resize:vertical;min-height:56px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red);}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .t-label{font-size:13.5px;font-weight:700;}
.toggle-row .t-desc{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.switch{position:relative;width:42px;height:24px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:var(--paper-deep);border:1px solid var(--line-strong);border-radius:20px;cursor:pointer;transition:.2s;}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;box-shadow:0 1px 3px rgba(59,42,26,0.3);border-radius:50%;transition:.2s;}
.switch input:checked + .track{background:var(--green);border-color:var(--green-dark);}
.switch input:checked + .track::after{transform:translateX(18px);}

.data-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.data-row{display:flex;align-items:center;gap:10px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
.data-row input[type=text]{flex:1;background:transparent;border:none;color:var(--ink);font-size:13.5px;padding:4px 2px;}
.data-row input[type=text]:focus{outline:none;}
.data-row input[type=number]{width:62px;background:var(--paper);border:1px solid var(--line-strong);border-radius:7px;color:var(--gold-dark);font-family:var(--font-mono);text-align:center;padding:6px 2px;font-size:13px;}
.data-row select{background:var(--paper);border:1px solid var(--line-strong);color:var(--ink);border-radius:7px;padding:6px 8px;font-size:12.5px;}
.row-icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink-faint);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
.row-icon-btn:hover{color:var(--red-dark);border-color:rgba(226,82,77,0.4);}
.row-icon-btn svg{width:13px;height:13px;}
.row-check{width:16px;height:16px;accent-color:var(--green);flex:0 0 auto;}
.color-dot{width:16px;height:16px;border-radius:5px;flex:0 0 auto;border:1px solid rgba(59,42,26,0.25);}
.swatch-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;}
.swatch{width:24px;height:24px;border-radius:7px;cursor:pointer;border:2px solid transparent;}
.swatch.active{border-color:var(--ink);}

.add-row{display:flex;gap:8px;margin-top:2px;}
.add-row input{flex:1;background:var(--paper-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:13.5px;}
.add-row button{white-space:nowrap;}

.btn{border:1px solid var(--line-strong);background:var(--paper-2);color:var(--ink);padding:9px 15px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.btn svg{width:14px;height:14px;}
.btn:hover{background:var(--paper-deep);}
.btn.primary{background:linear-gradient(160deg, var(--green-light), var(--green));color:#fff;border:none;}
.btn.danger{color:var(--red-dark);}
.btn.danger:hover{background:var(--red-dim);}
.btn.block{width:100%;justify-content:center;}
.btn.w-auto{width:auto;}

.settings-actions-row{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;}
.storage-note{background:var(--green-dim);border:1px solid rgba(63,172,114,0.35);border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--ink-dim);line-height:1.6;margin-bottom:16px;}
.storage-note b{color:var(--green-dark);}

.lb-list{display:flex;flex-direction:column;gap:7px;}
.lb-row{display:flex;align-items:center;gap:12px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
.lb-rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;background:var(--paper);color:var(--ink-faint);flex:0 0 auto;}
.lb-rank.top1{background:linear-gradient(160deg,var(--gold-light),var(--gold));color:#4a3006;}
.lb-rank.top2{background:linear-gradient(160deg,#e4e8ee,#b7c0cc);color:#22262c;}
.lb-rank.top3{background:linear-gradient(160deg,#e3b17e,#b3703f);color:#2a1608;}
.lb-tier-icon{width:calc(22px * var(--tier-mul,1));height:calc(22px * var(--tier-mul,1));object-fit:contain;flex:0 0 auto;}
.lb-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.lb-name{flex:1;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-score{font-family:var(--font-mono);font-weight:800;color:var(--gold-dark);font-size:15px;}
.lb-group-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.lb-legend-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-dim);background:var(--paper-2);border:1px solid var(--line);padding:5px 10px;border-radius:20px;}
.tab-row{display:flex;gap:6px;margin-bottom:14px;background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:4px;}
.tab-row button{flex:1;border:none;background:transparent;color:var(--ink-dim);padding:8px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;}
.tab-row button.active{background:var(--green);color:#fff;}

.hist-table{width:100%;border-collapse:collapse;font-size:13px;}
.hist-table th{text-align:left;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:0 10px 8px;font-weight:800;}
.hist-table td{padding:9px 10px;border-top:1px solid var(--line);}
.hist-table tr:hover td{background:var(--paper-2);}
.hist-time{font-family:var(--font-mono);color:var(--ink-faint);white-space:nowrap;}
.hist-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.hist-tag.ok{background:var(--green-dim);color:var(--green-dark);}
.hist-tag.skip{background:var(--paper-deep);color:var(--ink-faint);}
.hist-tag.redraw{background:var(--gold-dim);color:var(--gold-dark);}
.hist-pts{font-family:var(--font-mono);font-weight:800;text-align:right;}
.hist-pts.pos{color:var(--green-dark);}
.hist-pts.neg{color:var(--red-dark);}
.hist-empty{text-align:center;color:var(--ink-faint);padding:40px 0;font-size:13.5px;}

.event-card-display{text-align:center;padding:10px;}
.event-card-display .e-icon{font-size:44px;margin-bottom:14px;}
.event-card-display h3{font-family:var(--font-display);font-size:24px;margin:0 0 10px;}
.event-card-display p{color:var(--ink-dim);font-size:14.5px;line-height:1.6;}
.event-none{color:var(--ink-faint);font-size:14px;text-align:center;padding:20px 0;}

.sv-body{text-align:center;padding:6px 4px 2px;}
.sv-name{font-family:var(--font-display);font-weight:900;font-size:26px;margin-bottom:4px;}
.sv-meta{color:var(--ink-faint);font-size:13px;margin-bottom:16px;}
.sv-score{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;}
.sv-tier-icon{width:calc(58px * var(--tier-mul,1));height:calc(58px * var(--tier-mul,1));object-fit:contain;}
.sv-num{font-family:var(--font-mono);font-weight:900;font-size:36px;color:var(--gold-dark);}
.sv-unit{font-size:14px;color:var(--ink-faint);font-weight:700;}
.sv-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.sv-exclude{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:var(--ink-faint);margin-top:16px;cursor:pointer;}
.sv-exclude input{accent-color:var(--red);}

.class-manager-list{display:flex;flex-direction:column;gap:9px;margin-bottom:16px;}
.cm-row{display:flex;align-items:center;gap:12px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.cm-row.active{border-color:var(--green);background:var(--green-dim);}
.cm-icon{width:38px;height:38px;border-radius:11px;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold-dark);flex:0 0 auto;}
.cm-row.active .cm-icon{background:var(--green);color:#fff;}
.cm-info{flex:1;min-width:0;}
.cm-name-input{border:none;background:transparent;font-size:14.5px;font-weight:800;color:var(--ink);width:100%;padding:2px 0;}
.cm-name-input:focus{outline:none;border-bottom:1px solid var(--line-strong);}
.cm-meta{font-size:11.5px;color:var(--ink-faint);}
.cm-btn{border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.cm-btn:hover{background:var(--paper-deep);}
.cm-btn.on{background:var(--green);color:#fff;border:none;}

.toast-stack{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--paper);border:1px solid var(--line-strong);color:var(--ink);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow-soft);display:flex;align-items:center;gap:9px;animation:toast-in .22s ease;}
.toast svg{width:15px;height:15px;color:var(--green);flex:0 0 auto;}
.toast.warn svg{color:var(--red-dark);}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

@media (max-width:1180px){:root{--panel-w:326px;} .brand-class-btn{max-width:22vw;}}
@media (max-width:900px){
  body{padding:10px;background-attachment:scroll;}
  #app{overflow-y:auto;height:auto;min-height:calc(100vh - 20px);border-radius:18px;}
  .app-main,.app-main.panel-collapsed{grid-template-columns:1fr;grid-template-rows:1fr auto;overflow-y:auto;}
  body{overflow-y:auto;}
  .board-area{min-height:420px;}
  .control-panel-wrap{flex-direction:column;}
  .panel-rail-toggle{display:none;}
  .control-panel,.app-main.panel-collapsed .control-panel{overflow-y:visible;opacity:1;pointer-events:auto;width:auto;flex:1 1 auto;}
}
@media (max-width:760px){
  body{padding:0;}
  #app{border-radius:0;box-shadow:none;}
  .app-header{flex-wrap:wrap;height:auto;padding:10px 14px;gap:10px;}
  .mode-tabs{order:3;width:100%;margin:0;}
  .brand-class-btn{max-width:46vw;}
  .ring-layer,.ring-track-svg{display:none;}
  .board-area{min-height:0;border-width:3px;}
  .stage{position:static;transform:none;width:100%;height:auto;min-height:280px;margin:14px 0;}
  .app-main{padding:12px;gap:12px;}
  .header-actions{gap:6px;}
  .icon-btn.labeled span{display:none;}
}

      <aside class="control-panel" id="controlPanel">

</div>

<div class="modal-backdrop" id="modalSettings">

  </div>
</div>

<div class="modal-backdrop" id="modalLeaderboard">
  <div class="modal w-md">
    <div class="modal-head"><h2 id="mIconLeaderboard"></h2><button class="modal-close" data-close="modalLeaderboard"></button></div>
    <div class="modal-body" id="leaderboardBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalHistory">
  <div class="modal w-lg">
    <div class="modal-head"><h2 id="mIconHistory"></h2><button class="modal-close" data-close="modalHistory"></button></div>
    <div class="modal-body" id="historyBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalEvent">
  <div class="modal w-sm">
    <div class="modal-head"><h2 id="mIconEvent"></h2><button class="modal-close" data-close="modalEvent"></button></div>
    <div class="modal-body" id="eventBody"></div>

</div>

<div class="modal-backdrop" id="modalStudentView">

    <div class="modal-head"><h2 id="mIconStudentView"></h2><button class="modal-close" data-close="modalStudentView"></button></div>
    <div class="modal-body"><div class="sv-body" id="studentViewBody"></div></div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

const GOOGLE_CLIENT_ID = '1054933165782-rbkjnuubcqn8ffqt0gikq01gk1eb923q.apps.googleusercontent.com';
const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';

const GDrive = {
  ready:false, tokenClient:null, accessToken:null, tokenExpiry:0, signedIn:false, fileIds:{},

  configured(){ return !!GOOGLE_CLIENT_ID; },

  // Waits for the GIS script to load (bounded, so a blocked/slow network
  // can't hang the app forever) and, once ready, makes exactly one
  // best-effort silent reconnect attempt. Resolves true only if that

  init(){
    if(!this.configured() || IN_CLAUDE_ENV) return Promise.resolve(false);
    return new Promise((resolveOuter) => {
      const deadline = Date.now() + 5000;
      const tryInit = () => {
        if(window.google && google.accounts && google.accounts.oauth2){
          this.tokenClient = google.accounts.oauth2.initTokenClient({

        if(Date.now() > deadline){ resolveOuter(false); return; }

  _trySilent(){
    // Best-effort silent reconnect if the browser still has an active
    // Google session and prior consent. Browsers that block third-party
    // cookies may silently refuse this — that's fine, the user can always
    // click the "使用 Google 帳戶登入" control instead.
    return new Promise((resolve) => {

      this.tokenClient.callback = (resp) => {

        resolve(true);
      };

  _onToken(resp){
    this.accessToken = resp.access_token;

  signIn(){
    return new Promise((resolve) => {
      if(!this.ready){ resolve(false); return; }
      this.tokenClient.callback = (resp) => {
        if(resp.error){ resolve(false); return; }
        this._onToken(resp);
        resolve(true);
      };

      this.tokenClient.callback = (resp) => {

    });
  },

  async _findFileId(name){
    if(this.fileIds[name]) return this.fileIds[name];
    const q = encodeURIComponent(`name='${name}' and trashed=false`);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=appDataFolder&fields=files(id,name)`, {
      headers:{ Authorization:'Bearer '+this.accessToken }
    });
    if(!res.ok) throw new Error('drive list failed: '+res.status);
    const data = await res.json();
    const id = (data.files && data.files[0]) ? data.files[0].id : null;
    if(id) this.fileIds[name] = id;
    return id;
  },

  async save(name, obj){
    if(!await this.ensureToken()) throw new Error('not signed in');
    const content = JSON.stringify(obj);
    const id = await this._findFileId(name);
    if(id){
      const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
        method:'PATCH',
        headers:{ Authorization:'Bearer '+this.accessToken, 'Content-Type':'application/json' },
        body: content,
      });
      if(!res.ok) throw new Error('drive update failed: '+res.status);
    } else {
      const boundary = 'clsdash_'+Date.now();
      const metadata = { name, parents:['appDataFolder'] };
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n`+
        `--${boundary}--`;
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method:'POST',
        headers:{ Authorization:'Bearer '+this.accessToken, 'Content-Type':`multipart/related; boundary=${boundary}` },
        body,
      });
      if(!res.ok) throw new Error('drive create failed: '+res.status);
      const data = await res.json();
      if(data.id) this.fileIds[name] = data.id;
    }
  },

  async load(name){
    if(!await this.ensureToken()) throw new Error('not signed in');
    const id = await this._findFileId(name);
    if(!id) return null;
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, {
      headers:{ Authorization:'Bearer '+this.accessToken }
    });
    if(!res.ok) return null;
    return res.text();
  },
};

const SCORE_TIERS = [
  {min:0,  img: IMG_COIN,   name:'金幣'},
  {min:3,  img: IMG_HOUSE2, name:'小屋'},
  {min:9,  img: IMG_HOUSE3, name:'房子'},
  {min:15, img: IMG_TOWER,  name:'塔樓'},
  {min:25, img: IMG_CASTLE, name:'城堡'},
];
// Higher tiers render their icon a little larger than the last, on top of
// whatever size the surrounding tile/card already scales it to.
const TIER_SCALE = [1.0, 1.08, 1.16, 1.26, 1.38];
function tierFor(score){
  const s = Math.max(0, score||0);
  let cur = SCORE_TIERS[0];
  for(const t of SCORE_TIERS){ if(s>=t.min) cur=t; else break; }
  return cur;
}
function tierIndexFor(score){
  const s = Math.max(0, score||0);
  let idx=0;
  SCORE_TIERS.forEach((t,i)=>{ if(s>=t.min) idx=i; });
  return idx;
}
function tierImg(t, cls){
  const idx = Math.max(0, SCORE_TIERS.indexOf(t));
  const mul = TIER_SCALE[idx] || 1;
  return '<img class="'+cls+'" style="--tier-mul:'+mul+'" src="'+t.img+'" alt="'+esc(t.name)+'">';
}

function makeGroups(names){ return names.map((name,i)=>({ id:uid('g'), name, color:GROUP_PALETTE[i%GROUP_PALETTE.length] })); }
function makeStudents(count, groups){
  const arr=[];
  for(let i=1;i<=count;i++){
    arr.push({ id:uid('s'), num:i, name:'學生'+i, groupId: groups.length?groups[(i-1)%groups.length].id:null, score:0, status:'unanswered', excluded:false });
  }
  return arr;
}
function freshRound(){
  return { history:[], roundNumber:1, lastDrawnStudentId:null, lastDrawnGroupId:null, lastDrawnChallengeId:null, lastDrawnEventId:null, currentDraw:null, currentMode:'student' };
}
function makeClass(name, studentCount, groupNames){
  const groups = makeGroups(groupNames);
  return { id:uid('cls'), name, students: makeStudents(studentCount, groups), groups, round: freshRound() };
}

  return { challenges, eventCards, settings:{ avoidRepeat:true, onlyUnanswered:false, allowManualExclude:true, animSpeed:'normal', soundOn:true, eventFrequency:'medium', panelCollapsed:true } };
}

const App = {
  data:null, shared:null,
  undoStack:[], audioCtx:null, rolling:false,
  settingsTab:'classes', lbTab:'students', histTab:'round',
  viewStudentId:null,
  els:{},

  activeClass(){ return this.data.classes.find(c=>c.id===this.data.activeClassId) || this.data.classes[0]; },

  async init(){
    this.cacheEls();
    this.bindStaticEvents();
    await this.loadData();
    this.applyPanelState();
    this.renderModeTabs();
    this.renderAll();
    this.layoutRing();
    window.addEventListener('resize', debounce(()=>{ this.layoutRing(); }, 120));
  },

  applyPanelState(){
    const collapsed = !!this.shared.settings.panelCollapsed;
    this.els.appMain.classList.toggle('panel-collapsed', collapsed);
    this.els.panelToggleBtn.setAttribute('aria-expanded', String(!collapsed));
  },
  togglePanel(){
    this.shared.settings.panelCollapsed = !this.shared.settings.panelCollapsed;
    this.applyPanelState();
    this.saveShared();
    this.layoutRing();
  },

  cacheEls(){
    const ids = ['brandArea','brandClassBtn','classDropdown','modeTabs','syncPill','btnLeaderboard','btnHistory','btnSettings',
      'appMain','boardArea','ringTrackSvg','ringLayer','stage','controlPanelWrap','panelToggleBtn','prtChevron','controlPanel','curCardTitle','currentCard','statusStrip',
      'actionTitle','scoreRow','qaTitle','qaGrid','lbMiniTitle','lbMini',
      'modalSettings','settingsNav','settingsPane','modalLeaderboard','leaderboardBody',
      'modalHistory','historyBody','modalEvent','eventBody','modalStudentView','studentViewBody',
      'toastStack','mIconSettings','mIconLeaderboard','mIconHistory','mIconEvent','mIconStudentView'];
    ids.forEach(id => this.els[id] = document.getElementById(id));
  },

  bindStaticEvents(){
    this.els.btnLeaderboard.innerHTML = icon('trophy') + '<span>積分榜</span>';
    this.els.btnHistory.innerHTML = icon('history') + '<span>本輪紀錄</span>';
    this.els.btnSettings.innerHTML = icon('settings');
    this.els.mIconSettings.innerHTML = icon('settings') + ' 教師設定';
    this.els.mIconLeaderboard.innerHTML = icon('trophy') + ' 積分榜';
    this.els.mIconHistory.innerHTML = icon('history') + ' 本輪抽籤紀錄';
    this.els.mIconEvent.innerHTML = icon('ticket') + ' 事件卡';
    this.els.mIconStudentView.innerHTML = icon('user') + ' 學生資料';
    this.els.prtChevron.innerHTML = icon('chevron');

    this.els.btnLeaderboard.onclick = () => this.openLeaderboard();
    this.els.btnHistory.onclick = () => this.openHistory();
    this.els.btnSettings.onclick = () => this.openSettings();
    this.els.brandClassBtn.onclick = (e) => { e.stopPropagation(); this.toggleClassDropdown(); };
    this.els.panelToggleBtn.onclick = () => this.togglePanel();
    this.els.appMain.addEventListener('transitionend', (e)=>{
      if(e.propertyName==='grid-template-columns') this.layoutRing();
    });

    document.addEventListener('click', (e)=>{
      if(!this.els.brandArea.contains(e.target)) this.closeClassDropdown();
    });

    document.querySelectorAll('[data-close]').forEach(btn=>{
      btn.innerHTML = icon('x');
      btn.onclick = () => this.closeModal(btn.dataset.close);
    });
    document.querySelectorAll('.modal-backdrop').forEach(bd=>{
      bd.addEventListener('click', e=>{ if(e.target === bd) this.closeModal(bd.id); });
    });
    document.addEventListener('keydown', e=>{
      if(e.key === 'Escape'){
        document.querySelectorAll('.modal-backdrop.open').forEach(bd => this.closeModal(bd.id));
        this.closeClassDropdown();
      }
    });
  },

  openModal(id){ document.getElementById(id).classList.add('open'); },
  closeModal(id){ document.getElementById(id).classList.remove('open'); },

  async loadData(){
    if(IN_CLAUDE_ENV){
      let data=null, shared=null;
      try{ const r = await window.storage.get('clsdash-classes-v2', false); if(r && r.value) data = JSON.parse(r.value); }catch(e){ data=null; }
      try{ const r = await window.storage.get('clsdash-shared-v2', false); if(r && r.value) shared = JSON.parse(r.value); }catch(e){ shared=null; }

      if(!data || !shared){
        let oldCfg=null, oldRound=null;
        try{ const r = await window.storage.get('clsdash-config', false); if(r && r.value) oldCfg = JSON.parse(r.value); }catch(e){}
        try{ const r = await window.storage.get('clsdash-round', false); if(r && r.value) oldRound = JSON.parse(r.value); }catch(e){}
        if(oldCfg && !data){
          const migrated = {
            id: uid('cls'), name: oldCfg.className || '我的班別',
            students: (oldCfg.students||[]).map(s=>({ id:s.id||uid('s'), num:s.num, name:s.name, groupId:s.groupId||null, score:s.score||0, status:s.status||'unanswered', excluded:!!s.excluded })),
            groups: oldCfg.groups || [],
            round: oldRound || freshRound(),
          };
          if(migrated.round.lastDrawnEventId===undefined) migrated.round.lastDrawnEventId=null;
          data = { activeClassId: migrated.id, classes:[migrated] };
        }
        if(oldCfg && !shared){
          shared = { challenges: oldCfg.challenges||[], eventCards: oldCfg.eventCards||[], settings: Object.assign({avoidRepeat:true,onlyUnanswered:false,allowManualExclude:true,animSpeed:'normal',soundOn:true,eventFrequency:'medium',panelCollapsed:true}, oldCfg.settings||{}) };
        }
      }
      if(!data){ const classes = demoClasses(); data = { activeClassId: classes[0].id, classes }; }
      if(!shared){ shared = demoShared(); }
      this.normalizeLoadedData(data, shared);
      this.data = data;
      this.shared = shared;
      this.saveData(true); this.saveShared(true);
      return;
    }

    // ---- Self-hosted: window.storage doesn't exist here, so Google
    // Drive (once signed in) is the only persistence layer. ----
    const signedInSilently = await GDrive.init();
    if(signedInSilently){
      await this.loadFromDrive(true);
    } else {
      const classes = demoClasses();
      this.data = { activeClassId: classes[0].id, classes };
      this.shared = demoShared();
      this.setSync(GDrive.configured() ? 'signedout' : 'unconfigured');
    }
  },

  normalizeLoadedData(data, shared){
    data.classes.forEach(c=>{
      if(!c.round) c.round = freshRound();
      if(c.round.lastDrawnEventId===undefined) c.round.lastDrawnEventId=null;
      if(!c.round.currentMode) c.round.currentMode='student';
    });
    if(!data.classes.find(c=>c.id===data.activeClassId)) data.activeClassId = data.classes[0].id;
    if(!shared.eventCards) shared.eventCards=[];
    if(!shared.challenges) shared.challenges=[];
    if(!shared.settings.eventFrequency) shared.settings.eventFrequency='medium';
    if(shared.settings.panelCollapsed===undefined) shared.settings.panelCollapsed=true;
  },

  async loadFromDrive(isInitialLoad){
    let data=null, shared=null;
    try{ const raw = await GDrive.load(GDRIVE_FILE_DATA); if(raw) data = JSON.parse(raw); }catch(e){ this.setSync('error'); return; }
    try{ const raw = await GDrive.load(GDRIVE_FILE_SHARED); if(raw) shared = JSON.parse(raw); }catch(e){ this.setSync('error'); return; }
    const isBrandNew = !data && !shared;
    if(!data){ const classes = demoClasses(); data = { activeClassId: classes[0].id, classes }; }
    if(!shared){ shared = demoShared(); }
    this.normalizeLoadedData(data, shared);
    this.data = data;
    this.shared = shared;
    if(isBrandNew){ this.saveData(true); this.saveShared(true); }
    else this.setSync('idle');
  },

  async onGoogleSignedIn(silent){
    if(!GDrive.signedIn) return;
    await this.loadFromDrive(false);
    this.renderAll(); this.layoutRing();
    if(!silent) this.toast('已連接 Google 帳戶，資料已同步');
  },
  async connectGoogle(){
    if(!GDrive.configured()){ this.toast('尚未設定 Google Client ID，請見設定 → 資料與同步', true); return; }
    this.setSync('saving');
    const ok = await GDrive.signIn();
    if(ok) await this.onGoogleSignedIn(false);
    else { this.setSync('signedout'); this.toast('Google 登入未完成', true); }
  },
  disconnectGoogle(){
    GDrive.signOut();
    this.setSync('signedout');
    this.toast('已登出 Google 帳戶，資料暫時只保留在此頁面');
  },

  saveData:null, saveShared:null,
  async _doSaveData(){
    if(IN_CLAUDE_ENV){
      this.setSync('saving');
      try{ await window.storage.set('clsdash-classes-v2', JSON.stringify(this.data), false); this.setSync('idle'); }catch(e){ this.setSync('error'); }
      return;
    }
    if(!GDrive.signedIn){ this.setSync(GDrive.configured() ? 'signedout' : 'unconfigured'); return; }
    this.setSync('saving');
    try{ await GDrive.save(GDRIVE_FILE_DATA, this.data); this.setSync('idle'); }catch(e){ this.setSync('error'); }
  },
  async _doSaveShared(){
    if(IN_CLAUDE_ENV){
      this.setSync('saving');
      try{ await window.storage.set('clsdash-shared-v2', JSON.stringify(this.shared), false); this.setSync('idle'); }catch(e){ this.setSync('error'); }
      return;
    }
    if(!GDrive.signedIn){ this.setSync(GDrive.configured() ? 'signedout' : 'unconfigured'); return; }
    this.setSync('saving');
    try{ await GDrive.save(GDRIVE_FILE_SHARED, this.shared); this.setSync('idle'); }catch(e){ this.setSync('error'); }
  },

  setSync(state){
    const el = this.els.syncPill;
    el.onclick = null;
    if(state==='saving'){ el.className='sync-pill saving'; el.innerHTML = icon('cloud')+'<span>儲存中…</span>'; }
    else if(state==='error'){ el.className='sync-pill error'; el.innerHTML = icon('cloud')+'<span>儲存失敗，重試中</span>'; }
    else if(state==='signedout'){
      el.className='sync-pill signedout';
      el.innerHTML = icon('cloud')+'<span>尚未連接 Google，點擊登入</span>';
      el.onclick = () => this.connectGoogle();
    } else if(state==='unconfigured'){
      el.className='sync-pill signedout';
      el.innerHTML = icon('cloud')+'<span>尚未設定 Google 同步，點擊查看</span>';
      el.onclick = () => { this.settingsTab='data'; this.openSettings(); };
    } else {
      el.className='sync-pill';
      el.innerHTML = icon('cloudCheck')+'<span>'+(IN_CLAUDE_ENV?'已自動雲端儲存':'已連接 Google 雲端硬碟')+'</span>';
    }
  },

  renderAll(){
    this.renderModeTabs();
    this.renderStage();
    this.renderRing();
    this.renderPanel();
    this.renderBrandLabel();
  },
  renderBrandLabel(){
    const cls = this.activeClass();
    this.els.brandClassBtn.querySelector('.txt').textContent = cls.name;
  },

  renderModeTabs(){
    const cls = this.activeClass();
    const modes = [ {key:'student', label:'抽學生', icon:'user'}, {key:'group', label:'抽小組', icon:'users'}, {key:'challenge', label:'抽任務', icon:'clipboard'} ];
    this.els.modeTabs.innerHTML = modes.map(m => `
      <button class="mode-tab ${cls.round.currentMode===m.key?'active':''}" data-mode="${m.key}">${icon(m.icon)}<span>${m.label}</span></button>`).join('');
    this.els.modeTabs.querySelectorAll('.mode-tab').forEach(btn=>{
      btn.onclick = () => {
        const c = this.activeClass();
        const newMode = btn.dataset.mode;
        if(c.round.currentMode !== newMode){
          c.round.currentMode = newMode;
          c.round.currentDraw = null; // a reveal from a different mode no longer makes sense to show
        }
        this.saveData(); this.renderModeTabs(); this.renderStage(); this.renderPanel(); this.renderRing();
      };
    });
  },

  toggleClassDropdown(){ this.els.classDropdown.classList.contains('open') ? this.closeClassDropdown() : this.openClassDropdown(); },
  openClassDropdown(){ this.renderClassDropdown(); this.els.classDropdown.classList.add('open'); this.els.brandClassBtn.classList.add('open'); },
  closeClassDropdown(){ this.els.classDropdown.classList.remove('open'); this.els.brandClassBtn.classList.remove('open'); },
  renderClassDropdown(){
    const active = this.data.activeClassId;
    const items = this.data.classes.map(c=>`
      <div class="cd-item ${c.id===active?'active':''}" data-id="${c.id}">
        <span class="cd-icon">${c.id===active?icon('check'):'班'}</span>
        <span class="cd-name">${esc(c.name)}</span>
        <span class="cd-count">${c.students.length}人</span>
      </div>`).join('');
    this.els.classDropdown.innerHTML = items +
      `<div class="cd-divider"></div>
       <button class="cd-action" id="cdAddNew">${icon('plusCircle')} 新增班別</button>
       <button class="cd-action" id="cdManage">${icon('settings')} 管理所有班別</button>`;
    this.els.classDropdown.querySelectorAll('.cd-item').forEach(el=>{
      el.onclick = () => { this.switchClass(el.dataset.id); this.closeClassDropdown(); };
    });
    this.els.classDropdown.querySelector('#cdAddNew').onclick = () => { this.quickAddClass(); this.closeClassDropdown(); };
    this.els.classDropdown.querySelector('#cdManage').onclick = () => { this.closeClassDropdown(); this.settingsTab='classes'; this.openSettings(); };
  },
  switchClass(id){
    if(id === this.data.activeClassId) return;
    this.data.activeClassId = id;
    this.undoStack = [];
    this.saveData();
    this.renderAll(); this.layoutRing();
    this.toast('已切換至「'+this.activeClass().name+'」');
  },
  quickAddClass(){
    const n = this.data.classes.length+1;
    const c = makeClass('新班別 '+n, 0, []);
    this.data.classes.push(c);
    this.data.activeClassId = c.id;
    this.saveData();
    this.renderAll(); this.layoutRing();
    this.toast('已新增班別，請到設定新增學生名單');
  },

  weightForStudent(s){ const effScore = Math.max(0, s.score); return Math.max(0.08, 1/(1+0.18*effScore)); },

  poolStudents(){
    const cls = this.activeClass();
    const s = this.shared.settings;
    let pool = cls.students.filter(st => !st.excluded);
    if(s.onlyUnanswered) pool = pool.filter(st => st.status !== 'answered');
    if(s.avoidRepeat && pool.length>1) pool = pool.filter(st => st.id !== cls.round.lastDrawnStudentId);
    if(pool.length===0){ pool = cls.students.filter(st => !st.excluded); if(pool.length===0) pool = cls.students.slice(); }
    return pool;
  },
  poolGroups(){
    const cls = this.activeClass();
    let pool = cls.groups.slice();
    if(this.shared.settings.avoidRepeat && pool.length>1) pool = pool.filter(g => g.id !== cls.round.lastDrawnGroupId);
    if(pool.length===0) pool = cls.groups.slice();
    return pool;
  },
  poolChallenges(){
    const cls = this.activeClass();
    let pool = this.shared.challenges.filter(c => c.enabled);
    if(this.shared.settings.avoidRepeat && pool.length>1) pool = pool.filter(c => c.id !== cls.round.lastDrawnChallengeId);
    if(pool.length===0) pool = this.shared.challenges.filter(c=>c.enabled);
    return pool;
  },
  poolEvents(){
    const cls = this.activeClass();
    let pool = this.shared.eventCards.filter(e => e.enabled);
    if(this.shared.settings.avoidRepeat && pool.length>1) pool = pool.filter(e => e.id !== cls.round.lastDrawnEventId);
    if(pool.length===0) pool = this.shared.eventCards.filter(e=>e.enabled);
    return pool;
  },
  drawStudentOrEvent(){
    const students = this.poolStudents();
    const events = this.poolEvents();
    const evWeight = EVENT_WEIGHT_MAP[this.shared.settings.eventFrequency] || 0.55;
    const entries = [];
    students.forEach(s => entries.push({ kind:'student', ref:s, weight:this.weightForStudent(s) }));
    events.forEach(e => entries.push({ kind:'event', ref:e, weight:evWeight }));
    if(entries.length===0) return null;
    const total = entries.reduce((a,x)=>a+x.weight,0);
    let r = Math.random()*total;
    for(const en of entries){ r -= en.weight; if(r<=0) return en; }
    return entries[entries.length-1];
  },

  getRingItems(){
    const cls = this.activeClass();
    const mode = cls.round.currentMode;
    if(mode==='group') return cls.groups.map(g=>({ kind:'group', id:g.id, ref:g }));
    const students = cls.students.map(s=>({ kind:'student', id:s.id, ref:s }));
    const events = this.shared.eventCards.filter(e=>e.enabled).map(e=>({ kind:'event', id:e.id, ref:e }));
    if(events.length===0 || students.length===0) return students.concat(events);
    const interval = Math.max(3, Math.round(students.length/events.length));
    const combined = [];
    let ei=0;
    students.forEach((s,idx)=>{
      combined.push(s);
      if((idx+1)%interval===0 && ei<events.length){ combined.push(events[ei]); ei++; }
    });
    while(ei<events.length){ combined.push(events[ei]); ei++; }
    return combined;
  },

  pushUndo(){
    const cls = this.activeClass();
    const snap = {
      classId: cls.id,
      students: JSON.parse(JSON.stringify(cls.students)),
      history: JSON.parse(JSON.stringify(cls.round.history)),
      currentDraw: JSON.parse(JSON.stringify(cls.round.currentDraw)),
      lastDrawnStudentId: cls.round.lastDrawnStudentId,
      lastDrawnGroupId: cls.round.lastDrawnGroupId,
      lastDrawnChallengeId: cls.round.lastDrawnChallengeId,
      lastDrawnEventId: cls.round.lastDrawnEventId,
      currentMode: cls.round.currentMode,
      roundNumber: cls.round.roundNumber,
    };
    this.undoStack.push(snap);
    if(this.undoStack.length>25) this.undoStack.shift();
  },
  undo(){
    for(let i=this.undoStack.length-1;i>=0;i--){
      if(this.undoStack[i].classId === this.data.activeClassId){
        const snap = this.undoStack.splice(i,1)[0];
        const cls = this.activeClass();
        cls.students = snap.students;
        cls.round.history = snap.history;
        cls.round.currentDraw = snap.currentDraw;
        cls.round.lastDrawnStudentId = snap.lastDrawnStudentId;
        cls.round.lastDrawnGroupId = snap.lastDrawnGroupId;
        cls.round.lastDrawnChallengeId = snap.lastDrawnChallengeId;
        cls.round.lastDrawnEventId = snap.lastDrawnEventId;
        cls.round.currentMode = snap.currentMode;
        cls.round.roundNumber = snap.roundNumber;
        this.saveData();
        this.renderAll();
        this.toast('已復原上一步操作');
        return;
      }
    }
    this.toast('沒有可復原的操作', true);
  },

  draw(mode, isRedraw){
    if(this.rolling) return;
    const cls = this.activeClass();
    if(mode) cls.round.currentMode = mode;
    const topMode = cls.round.currentMode;
    this.renderModeTabs();
    this.renderRing();

    let picked = null;
    if(topMode==='student'){
      picked = this.drawStudentOrEvent();
    } else if(topMode==='group'){
      const pool = this.poolGroups();
      if(pool.length) picked = { kind:'group', ref: pool[Math.floor(Math.random()*pool.length)] };
    } else {
      const pool = this.poolChallenges();
      if(pool.length) picked = { kind:'challenge', ref: pool[Math.floor(Math.random()*pool.length)] };
    }
    if(!picked){ this.renderStage(true); return; }

    if(!isRedraw) this.pushUndo();
    this.rolling = true;
    this.initAudio();
    this.runRollAnimation(topMode, picked);
  },
  redraw(){ const cls=this.activeClass(); if(!cls.round.currentDraw){ this.draw(); return; } this.draw(cls.round.currentMode, true); },

  runRollAnimation(topMode, picked){
    const speed = this.shared.settings.animSpeed;
    const totalSteps = speed==='fast' ? 10 : speed==='slow' ? 22 : 15;
    this.els.stage.innerHTML = this.stageRollingTemplate(topMode);
    const flicker = this.els.stage.querySelector('.roll-flicker');

    let tileEls = [];
    if(topMode==='student') tileEls = Array.from(this.els.ringLayer.querySelectorAll('.tile[data-kind="student"], .tile[data-kind="event"]'));
    else if(topMode==='group') tileEls = Array.from(this.els.ringLayer.querySelectorAll('.tile[data-kind="group"]'));

    this.els.ringLayer.querySelectorAll('.tile').forEach(t=>t.classList.remove('flash','selected'));

    const cls = this.activeClass();
    let flickerPool = [];
    if(topMode==='student') flickerPool = cls.students.concat(this.shared.eventCards.filter(e=>e.enabled));
    else if(topMode==='group') flickerPool = cls.groups;
    else flickerPool = this.shared.challenges.filter(c=>c.enabled);

    let i=0;
    const step = () => {
      if(i>=totalSteps){ this.finishDraw(picked); return; }
      const prog = i/totalSteps;
      const delay = 28 + Math.pow(prog,2.2)*130;
      if(tileEls.length){
        tileEls.forEach(t=>t.classList.remove('flash'));
        const r = tileEls[Math.floor(Math.random()*tileEls.length)];
        r.classList.add('flash');
      }
      if(flicker && flickerPool.length){
        const r2 = flickerPool[Math.floor(Math.random()*flickerPool.length)];
        if(topMode==='challenge') flicker.textContent = '···';
        else if(r2.num!==undefined) flicker.textContent = r2.num+' '+r2.name;
        else flicker.textContent = (r2.icon||'🎫')+' '+(r2.title||r2.name);
      }
      this.playTick();
      i++;
      setTimeout(step, delay);
    };
    step();
  },

  finishDraw(picked){
    this.rolling = false;
    this.els.ringLayer.querySelectorAll('.tile').forEach(t=>t.classList.remove('flash'));
    const cls = this.activeClass();
    const draw = { kind:picked.kind, id:picked.ref.id, roundAdded:0, ts:Date.now() };
    cls.round.currentDraw = draw;

    if(picked.kind==='student'){
      cls.round.lastDrawnStudentId = picked.ref.id;
      cls.round.history.unshift({ id:uid('h'), time:nowStr(), type:'student', label:'學生'+picked.ref.num+' '+picked.ref.name, result:'drawn', points:0, round:cls.round.roundNumber });
    } else if(picked.kind==='event'){
      cls.round.lastDrawnEventId = picked.ref.id;
      cls.round.history.unshift({ id:uid('h'), time:nowStr(), type:'event', label:(picked.ref.icon||'🎫')+' '+picked.ref.title, result:'drawn', points:0, round:cls.round.roundNumber });
    } else if(picked.kind==='group'){
      cls.round.lastDrawnGroupId = picked.ref.id;
      cls.round.history.unshift({ id:uid('h'), time:nowStr(), type:'group', label:picked.ref.name, result:'drawn', points:0, round:cls.round.roundNumber });
    } else {
      cls.round.lastDrawnChallengeId = picked.ref.id;
      cls.round.history.unshift({ id:uid('h'), time:nowStr(), type:'challenge', label:picked.ref.text, result:'drawn', points:0, round:cls.round.roundNumber });
    }
    if(cls.round.history.length>300) cls.round.history.length=300;

    this.saveData();
    this.renderStage();
    this.renderRing();
    this.renderPanel();
    this.playChime();
  },

  currentStudent(){ const cls=this.activeClass(); const d=cls.round.currentDraw; if(!d||d.kind!=='student') return null; return cls.students.find(s=>s.id===d.id)||null; },
  currentGroup(){ const cls=this.activeClass(); const d=cls.round.currentDraw; if(!d||d.kind!=='group') return null; return cls.groups.find(g=>g.id===d.id)||null; },
  currentChallenge(){ const d=this.activeClass().round.currentDraw; if(!d||d.kind!=='challenge') return null; return this.shared.challenges.find(c=>c.id===d.id)||null; },
  currentEvent(){ const d=this.activeClass().round.currentDraw; if(!d||d.kind!=='event') return null; return this.shared.eventCards.find(e=>e.id===d.id)||null; },

  _applyScoreDelta(studentId, delta){
    // Pure mutation only — no undo push, no save. Callers wrap this with
    // their own pushUndo()/saveData() at whatever granularity makes sense
    // (one snapshot per student, or one snapshot covering a whole group).
    const cls = this.activeClass();
    const s = cls.students.find(x=>x.id===studentId);
    if(!s) return null;
    const prevTier = tierIndexFor(s.score);
    s.score = (s.score||0) + delta;
    s.status = 'answered';
    const newTier = tierIndexFor(s.score);
    cls.round.history.unshift({ id:uid('h'), time:nowStr(), type:'student', label:'學生'+s.num+' '+s.name, result: delta>0?'加分':'減分', points:delta, round:cls.round.roundNumber });
    if(cls.round.history.length>300) cls.round.history.length=300;
    if(cls.round.currentDraw && cls.round.currentDraw.kind==='student' && cls.round.currentDraw.id===s.id){
      cls.round.currentDraw.roundAdded = (cls.round.currentDraw.roundAdded||0) + delta;
    }
    return { student:s, leveledUp: newTier>prevTier };
  },
  adjustStudentScore(studentId, delta){
    this.pushUndo();
    const res = this._applyScoreDelta(studentId, delta);
    this.saveData();
    return res;
  },
  adjustGroupScore(groupId, delta){
    // Awards delta to every member of the group as one undo-able action,
    // and updates their student records directly — the same data every
    // other screen (student picker, leaderboard, history) reads from, so
    // the effect is fully shared/synced rather than group-only.
    const cls = this.activeClass();
    const members = cls.students.filter(s=>s.groupId===groupId);
    if(members.length===0) return { count:0, anyLeveledUp:false };
    this.pushUndo();
    let anyLeveledUp = false;
    members.forEach(s=>{
      const res = this._applyScoreDelta(s.id, delta);
      if(res && res.leveledUp) anyLeveledUp = true;
    });
    if(cls.round.currentDraw && cls.round.currentDraw.kind==='group' && cls.round.currentDraw.id===groupId){
      cls.round.currentDraw.roundAdded = (cls.round.currentDraw.roundAdded||0) + delta;
    }
    this.saveData();
    return { count: members.length, anyLeveledUp };
  },
  addPoint(delta){
    const cls = this.activeClass();
    const d = cls.round.currentDraw;
    if(!d){ this.toast('請先抽出一位學生或小組', true); return; }
    if(d.kind==='student'){
      const s = this.currentStudent();
      if(!s){ this.toast('請先抽出一位學生', true); return; }
      const res = this.adjustStudentScore(s.id, delta);
      this.renderStage(); this.renderPanel(); this.renderRing();
      this.toast((delta>0?'已加 ':'已扣 ')+Math.abs(delta)+' 分'+(res && res.leveledUp && delta>0 ? '　升級了！' : ''));
    } else if(d.kind==='group'){
      const g = this.currentGroup();
      if(!g){ this.toast('請先抽出一個小組', true); return; }
      const res = this.adjustGroupScore(g.id, delta);
      if(res.count===0){ this.toast('「'+g.name+'」目前沒有學生，無法加分', true); return; }
      this.renderStage(); this.renderPanel(); this.renderRing();
      this.toast('已為「'+g.name+'」全員'+(delta>0?'加':'扣')+Math.abs(delta)+'分（共'+res.count+'人）'+(res.anyLeveledUp && delta>0 ? '　有人升級了！' : ''));
    } else {
      this.toast('目前抽中的項目不支援加減分', true);
    }
  },

  skip(){
    const cls = this.activeClass();
    const d = cls.round.currentDraw;
    if(!d){ this.toast('目前未有抽中對象', true); return; }
    this.pushUndo();
    let label='';
    if(d.kind==='student'){ const s=this.currentStudent(); label = s?('學生'+s.num+' '+s.name):'學生'; }
    else if(d.kind==='group'){ const g=this.currentGroup(); label = g?g.name:'小組'; }
    else if(d.kind==='event'){ const e=this.currentEvent(); label = e?e.title:'事件'; }
    else { const c=this.currentChallenge(); label = c?c.text:'任務'; }
    cls.round.history.unshift({ id:uid('h'), time:nowStr(), type:d.kind, label, result:'跳過', points:0, round:cls.round.roundNumber });
    cls.round.currentDraw = null;
    this.saveData();
    this.renderStage(); this.renderRing(); this.renderPanel();
    this.toast('已跳過');
  },

  resetRound(){
    const cls = this.activeClass();
    this.pushUndo();
    cls.students.forEach(s=>{ s.status='unanswered'; });
    cls.round.roundNumber += 1;
    cls.round.lastDrawnStudentId = null;
    cls.round.lastDrawnGroupId = null;
    cls.round.lastDrawnChallengeId = null;
    cls.round.lastDrawnEventId = null;
    cls.round.currentDraw = null;
    this.saveData();
    this.renderAll();
    this.toast('已重置本輪，所有學生可再次被抽中');
  },

  fullReset(){
    this.data = { activeClassId:null, classes: demoClasses() };
    this.data.activeClassId = this.data.classes[0].id;
    this.shared = demoShared();
    this.undoStack = [];
    this.saveData(); this.saveShared();
    this.renderAll(); this.layoutRing();
    this.closeModal('modalSettings');
    this.toast('資料已重置為示範班別');
  },

      <div class="sv-actions">

    `;

    body.querySelector('#svMinus').onclick = () => { this.adjustStudentScore(s.id, -1); this.renderStudentView(); this.renderRing(); this.renderPanel(); this.renderStage(); };

    const exclEl = body.querySelector('#svExcl');

  renderStage(poolEmpty){
    const st = this.els.stage;
    if(this.rolling) return;
    const cls = this.activeClass();

    if(poolEmpty){
      const m = cls.round.currentMode;
      const msg = m==='student' ? '沒有可供抽取的學生（可能已全部排除）' : m==='group' ? '沒有可供抽取的小組' : '沒有已啟用的任務，請到設定新增';
      st.innerHTML = `<div class="stage-idle"><div class="eyebrow">Classroom Console</div><h1>暫時無法抽籤</h1><p class="empty-pool-msg">${msg}</p>

          <button class="act-btn" id="stageSettingsBtn">${icon('settings')} 開啟設定</button>
        </div></div>`;

        <div class="result-kicker k-student">${icon('user')} 學生</div>

        <div class="result-sub">學生編號 ${s.num} ${g?('｜'+esc(g.name)):''}｜目前總分 <b style="color:var(--gold-dark)">${s.score}</b>${d.roundAdded?('｜本次 '+(d.roundAdded>0?'+':'')+d.roundAdded):''}</div>
        <div class="stage-actions">
          <button class="act-btn primary" id="stAdd">${icon('plus')} 加分</button>
          <button class="act-btn" id="stSkip">${icon('skip')} 跳過</button>

      st.querySelector('#stSkip').onclick = () => this.skip();
      st.querySelector('#stRedraw').onclick = () => this.redraw();

        <div class="result-kicker k-event">${icon('ticket')} 事件卡</div>
        <div class="round-badge">${icon('layers')} 第 ${cls.round.roundNumber} 輪</div>
        <div class="result-event-icon" id="sealHost">${esc(e.icon||'🎫')}</div>
        <div class="result-name" style="font-size:clamp(22px,2.6vw,32px);">${esc(e.title)}</div>

      const fruit = tierFor(avgScore);

          <button class="act-btn" id="stSkip">${icon('skip')} 跳過</button>

      st.querySelector('#stAdd').onclick = () => this.addPoint(1);

      const c = this.currentChallenge();

        <div class="round-badge">${icon('layers')} 第 ${cls.round.roundNumber} 輪</div>
        <div class="result-challenge-text" id="sealHost">${esc(c.text)}</div>
        <div class="stage-actions">
          <button class="act-btn" id="stSkip">${icon('redraw')} 換一個</button>
