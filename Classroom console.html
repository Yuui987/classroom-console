  modeLabel(){ const m = this.activeClass().round.currentMode; return m==='student' ? '抽學生' : m==='group' ? '抽小組' : '抽任務'; },

  spawnSeal(hostId){
    const host = document.getElementById(hostId);
    if(!host) return;
    const seal = document.createElement('div');
    seal.className = 'seal stamp-in';
    seal.textContent = '答';
    const rect = host.getBoundingClientRect();
    const stageRect = this.els.stage.getBoundingClientRect();
    seal.style.left = (rect.right - stageRect.left + 6) + 'px';
    seal.style.top = (rect.top - stageRect.top - 6) + 'px';
    this.els.stage.appendChild(seal);
    setTimeout(()=>{ if(seal.parentNode) seal.remove(); }, 2200);
  },
  spawnParticles(){
    const colors = ['#e2524d','#e3a83c','#3fac72'];
    const stageEl = this.els.stage;
    const rect = stageEl.getBoundingClientRect();
    const cx = rect.width/2, cy = rect.height*0.4;
    for(let i=0;i<12;i++){
      const p = document.createElement('div');
      p.className='particle';
      const ang = Math.random()*Math.PI*2;
      const dist = 60+Math.random()*90;
      p.style.setProperty('--dx', (Math.cos(ang)*dist)+'px');
      p.style.setProperty('--dy', (Math.sin(ang)*dist)+'px');
      p.style.left = cx+'px'; p.style.top = cy+'px';
      p.style.background = colors[i%colors.length];
      stageEl.appendChild(p);
      setTimeout(()=>{ if(p.parentNode) p.remove(); }, 700);
    }
  },

  layoutRing(){
    const board = this.els.boardArea;
    const w = board.clientWidth, h = board.clientHeight;
    if(w<10||h<10) return;

    // Below this breakpoint the ring is hidden by CSS and the stage
    // becomes a static, full-width block (see the max-width:760px rule).
    // Skip inline positioning entirely so those CSS rules take over
    // cleanly instead of being overridden by leftover inline styles.
    if(window.innerWidth <= 760){
      const stageEl = this.els.stage;
      stageEl.style.left = ''; stageEl.style.top = '';
      stageEl.style.width = ''; stageEl.style.height = '';
      return;
    }

    const items = this.getRingItems();
    const mode = this.activeClass().round.currentMode;

    // Group counts are always small (typically 4-10) and don't benefit
    // from being forced into an edge-to-edge grid the way 20-40+ students
    // do — a rigid grid either wastes tiles on excess empty slots or has
    // to shrink the stage awkwardly to keep an interior. A classic
    // generously-sized fixed stage with tiles floating around it fits
    // this case better.
    if(mode==='group') this.layoutRingFloating(w, h, items);
    else this.layoutRingGrid(w, h, items);
  },

  layoutRingGrid(w, h, items){
    const svg = this.els.ringTrackSvg;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const n = Math.max(items.length, 1);

    // Choose a perimeter grid (cols x rows) sized to the board's own aspect
    // ratio, starting from the smallest grid that still leaves an interior
    // (>=3x3) and growing whichever side is furthest behind the board's
    // proportions until there is a slot for every item. This keeps tiles
    // as large as possible and roughly square, edge-to-edge, like a real
    // board game rather than floating with gaps.
    let cols = 3, rows = 3;
    while(2*cols + 2*rows - 4 < n){
      if(cols/rows < w/h) cols++; else rows++;
    }
    // The interior (stage) must stay big enough for its own reveal-card
    // content (kicker, round badge, icon, name, sub-line, action buttons)
    // regardless of how few items there are — otherwise a small class
    // can shrink the stage below what its own content needs.
    const MIN_STAGE_W = 420, MIN_STAGE_H = 350;
    let guard = 0;
    while(h*(rows-2)/rows < MIN_STAGE_H && guard < 60){ rows++; guard++; }
    guard = 0;
    while(w*(cols-2)/cols < MIN_STAGE_W && guard < 60){ cols++; guard++; }
    const capacity = 2*cols + 2*rows - 4;
    const cellW = w/cols, cellH = h/rows;

    const slots = [];
    for(let c=0;c<cols;c++) slots.push({ x:(c+0.5)*cellW, y:0.5*cellH });
    for(let r=1;r<rows-1;r++) slots.push({ x:(cols-0.5)*cellW, y:(r+0.5)*cellH });
    for(let c=cols-1;c>=0;c--) slots.push({ x:(c+0.5)*cellW, y:(rows-0.5)*cellH });
    for(let r=rows-2;r>=1;r--) slots.push({ x:0.5*cellW, y:(r+0.5)*cellH });

    // If there are more slots than items (small classes), spread the
    // picked slots evenly around the loop rather than filling from one
    // corner, so empty gaps don't all pile up on one side.
    const pickedIdx = [];
    let last = -1;
    for(let i=0;i<n;i++){
      let idx = Math.round(i*capacity/n);
      if(idx<=last) idx = last+1;
      if(idx>=capacity) idx = capacity-1;
      pickedIdx.push(idx);
      last = idx;
    }

    svg.innerHTML = `<rect x="1" y="1" width="${w-2}" height="${h-2}" rx="18" ry="18" fill="none" stroke="rgba(59,42,26,0.14)" stroke-width="1.5"/>`;

    const gap = 4;
    const tiles = Array.from(this.els.ringLayer.children);
    tiles.forEach((el, idx)=>{
      if(idx>=items.length) return;
      const slot = slots[pickedIdx[idx]];
      el.style.left = slot.x+'px';
      el.style.top = slot.y+'px';
      el.style.width = (cellW-gap)+'px';
      el.style.height = (cellH-gap)+'px';
    });

    // Size the stage to the available interior, but always position it by
    // explicitly centering on the board's own center point — rather than
    // deriving its left/top from cellW/cellH — so it's guaranteed centered
    // regardless of how the grid's columns/rows work out. A sensible cap
    // also keeps it from sprawling edge-to-edge on very wide, many-column
    // boards, which reads better than one huge mostly-empty box.
    const interiorW = Math.max(200, w-2*cellW);
    const interiorH = Math.max(160, h-2*cellH);
    const stageW = Math.min(interiorW, 1500);
    const stageH = Math.min(interiorH, 900);
    const stageEl = this.els.stage;
    stageEl.style.left = ((w-stageW)/2)+'px';
    stageEl.style.top = ((h-stageH)/2)+'px';
    stageEl.style.width = stageW+'px';
    stageEl.style.height = stageH+'px';
  },

  layoutRingFloating(w, h, items){
    const svg = this.els.ringTrackSvg;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const n = Math.max(items.length, 1);

    const trackFor = (fw, fh) => {
      const marginX = Math.max(30, fw/2 + 14);
      const marginY = Math.max(30, fh/2 + 14);
      const left = marginX, right = Math.max(marginX+10, w-marginX);
      const top = marginY, bottom = Math.max(marginY+10, h-marginY);
      const trackW = right-left, trackH = bottom-top;
      const perim = 2*(trackW+trackH);
      const pointAt = (s) => {
        s = ((s % perim) + perim) % perim;
        if(s <= trackW) return { x:left+s, y:top };
        s -= trackW;
        if(s <= trackH) return { x:right, y:top+s };
        s -= trackH;
        if(s <= trackW) return { x:right-s, y:bottom };
        s -= trackW;
        return { x:left, y:bottom-s };
      };
      const step = perim/n;
      const pts = [];
      for(let i=0;i<n;i++) pts.push(pointAt(i*step));
      return { pts, left, top, trackW, trackH, marginX, marginY };
    };
    const overlapsAny = (pts, fw, fh) => {
      for(let i=0;i<pts.length;i++){
        const a = pts[i], b = pts[(i+1)%pts.length];
        const dx = Math.abs(a.x-b.x), dy = Math.abs(a.y-b.y);
        if(fw-dx > 0.5 && fh-dy > 0.5) return true;
      }
      return false;
    };

    // Choose tile size and its track margins first — with only a handful
    // of groups, there's no need to squeeze the stage to fit a grid
    // interior, so tiles here float around a fixed, centered stage
    // instead of tiling the whole edge.
    const candidates = [220,196,174,154,136,120,106,94];
    const aspectH = 0.506;
    let footprintW = candidates[candidates.length-1];
    let footprintH = Math.round(footprintW*aspectH);
    let chosen = null;
    for(const cw of candidates){
      const ch = Math.round(cw*aspectH);
      const track = trackFor(cw, ch);
      if(!overlapsAny(track.pts, cw, ch)){ footprintW=cw; footprintH=ch; chosen=track; break; }
    }
    if(!chosen) chosen = trackFor(footprintW, footprintH);

    // The stage wants to be generous (420x350 floor, or 46%/54% of the
    // board when that's bigger) for its own reveal-card content, but is
    // always clamped to fit safely inside the track's margins so it can
    // never reach far enough to overlap a tile — safety by construction
    // rather than by hoping the percentages happen to work out.
    // chosen.marginX/marginY is the distance from the board edge to a
    // tile's *center*; the tile itself extends footprintW/2 / footprintH/2
    // further out from that center, so the true clearance needed is the
    // margin PLUS that half-extent, not the margin alone.
    const clearX = chosen.marginX + footprintW/2 + 10;
    const clearY = chosen.marginY + footprintH/2 + 10;
    const maxStageW = Math.max(200, w - 2*clearX);
    const maxStageH = Math.max(160, h - 2*clearY);
    const desiredW = Math.max(420, w*0.46);
    const desiredH = Math.max(350, h*0.54);
    const stageW = Math.min(desiredW, maxStageW);
    const stageH = Math.min(desiredH, maxStageH);
    const stageLeft = (w-stageW)/2, stageTop = (h-stageH)/2;

    svg.innerHTML = `<rect x="${chosen.left}" y="${chosen.top}" width="${chosen.trackW}" height="${chosen.trackH}" rx="20" ry="20" fill="none" stroke="rgba(59,42,26,0.16)" stroke-width="1.5" stroke-dasharray="3 7"/>`;

    const tiles = Array.from(this.els.ringLayer.children);
    tiles.forEach((el, idx)=>{
      if(idx>=items.length) return;
      const p = chosen.pts[idx];
      el.style.left = p.x+'px';
      el.style.top = p.y+'px';
      el.style.width = footprintW+'px';
      el.style.height = footprintH+'px';
    });

    const stageEl = this.els.stage;
    stageEl.style.left = stageLeft+'px';
    stageEl.style.top = stageTop+'px';
    stageEl.style.width = stageW+'px';
    stageEl.style.height = stageH+'px';
  },

  renderRing(){
    const cls = this.activeClass();
    const items = this.getRingItems();
    const layer = this.els.ringLayer;
    layer.innerHTML = items.map(item=>{
      if(item.kind==='group'){

        const count = cls.students.filter(s=>s.groupId===g.id).length;
        const avg = count ? cls.students.filter(s=>s.groupId===g.id).reduce((a,s)=>a+s.score,0)/count : 0;
        const fruit = tierFor(avg);
        const selected = cls.round.currentDraw && cls.round.currentDraw.kind==='group' && cls.round.currentDraw.id===g.id;
        return `<div class="tile group-tile ${selected?'selected':''}" data-kind="group" data-id="${g.id}">
          <div class="gt-row1"><span class="g-swatch" style="background:${g.color}"></span><span class="g-name">${esc(g.name)}</span></div>
          <div class="gt-row2"><span class="g-count">${count} 人</span>${tierImg(fruit,'group-tier-icon')}</div>
        </div>`;
      }
      if(item.kind==='event'){
        const e = item.ref;
        const selected = cls.round.currentDraw && cls.round.currentDraw.kind==='event' && cls.round.currentDraw.id===e.id;
        return `<div class="tile tile-event ${selected?'selected':''}" data-kind="event" data-id="${e.id}" title="${esc(e.title)}">
          <span class="tile-emoji">${esc(e.icon||'🎫')}</span><span class="tile-name">事件</span>
        </div>`;
      }
      const s = item.ref;
      const g = cls.groups.find(x=>x.id===s.groupId);
      const fruit = tierFor(s.score);
      const selected = cls.round.currentDraw && cls.round.currentDraw.kind==='student' && cls.round.currentDraw.id===s.id;
      const cls2 = ['tile'];
      if(s.status==='answered') cls2.push('st-answered');
      if(s.excluded) cls2.push('st-excluded');
      if(selected) cls2.push('selected');
      return `<div class="${cls2.join(' ')}" data-kind="student" data-id="${s.id}" title="${esc(s.name)}">
        <div class="tile-band" style="background:${g?g.color:'var(--paper-deep)'}">

        <div class="tile-body">
          <span class="tile-name">${esc(s.name)}</span>
          <span class="tile-score">${s.score} 分</span>
        </div>
      </div>`;
    }).join('');

    layer.querySelectorAll('.tile').forEach(t=>{
      t.addEventListener('click', ()=>{
        if(this.rolling) return;
        if(t.dataset.kind==='student') this.openStudentView(t.dataset.id);
        else if(t.dataset.kind==='event') this.previewEventTile(t.dataset.id);
      });
    });
    this.layoutRing();
  },

    this.els.lbMini.innerHTML = top.length ? top.map((s,i)=>`
      <div class="mini-row"><span class="n"><span class="mini-rank">${i+1}</span>${tierImg(tierFor(s.score),'mini-tier-icon')} ${esc(s.name)}</span><span class="v">${s.score}</span></div>
    `).join('') : `<div class="mini-empty">暫無學生資料</div>`;

  openLeaderboard(){ this.lbTab = 'students'; this.renderLeaderboard(); this.openModal('modalLeaderboard'); },
  renderLeaderboard(){
    const cls = this.activeClass();
    const body = this.els.leaderboardBody;
    const legend = cls.groups.map(g=>`<span class="lb-legend-chip"><span class="lb-dot" style="background:${g.color}"></span>${esc(g.name)}</span>`).join('');
    body.innerHTML = `
      <div class="tab-row"><button data-t="students" class="${this.lbTab==='students'?'active':''}">學生排名</button><button data-t="groups" class="${this.lbTab==='groups'?'active':''}">小組排名</button></div>
      <div class="lb-group-legend">${legend}</div>
      <div class="lb-list" id="lbListInner"></div>`;
    body.querySelectorAll('.tab-row button').forEach(b=> b.onclick=()=>{ this.lbTab=b.dataset.t; this.renderLeaderboard(); });

    const inner = document.getElementById('lbListInner');
    if(this.lbTab==='students'){
      const list = cls.students.slice().sort((a,b)=>b.score-a.score);
      inner.innerHTML = list.map((s,i)=>{
        const g = cls.groups.find(x=>x.id===s.groupId);
        const rankCls = i===0?'top1':i===1?'top2':i===2?'top3':'';
        return `<div class="lb-row"><span class="lb-rank ${rankCls}">${i+1}</span>${tierImg(tierFor(s.score),'lb-tier-icon')}${g?`<span class="lb-dot" style="background:${g.color}"></span>`:''}<span class="lb-name">${esc(s.name)}</span><span class="lb-score">${s.score}</span></div>`;
      }).join('') || `<div class="mini-empty">暫無資料</div>`;
    } else {
      const gscores = cls.groups.map(g=>{
        const members = cls.students.filter(s=>s.groupId===g.id);
        const total = members.reduce((a,s)=>a+s.score,0);
        const avg = members.length ? (total/members.length) : 0;
        return {g, total, avg, count:members.length};
      }).sort((a,b)=>b.total-a.total);
      inner.innerHTML = gscores.map((row,i)=>{
        const rankCls = i===0?'top1':i===1?'top2':i===2?'top3':'';
        return `<div class="lb-row"><span class="lb-rank ${rankCls}">${i+1}</span>${tierImg(tierFor(row.avg),'lb-tier-icon')}<span class="lb-dot" style="background:${row.g.color}"></span><span class="lb-name">${esc(row.g.name)} <span style="color:var(--ink-faint);font-weight:400;font-size:11.5px;">（${row.count} 人・平均 ${row.avg.toFixed(1)}）</span></span><span class="lb-score">${row.total}</span></div>`;
      }).join('') || `<div class="mini-empty">暫無小組</div>`;
    }
  },

  openHistory(){ this.histTab = 'round'; this.renderHistory(); this.openModal('modalHistory'); },
  renderHistory(){
    const cls = this.activeClass();
    const body = this.els.historyBody;
    const all = cls.round.history;
    const rows = this.histTab==='round' ? all.filter(h=>h.round===cls.round.roundNumber) : all;
    const tabsHtml = `<div class="tab-row" style="margin-bottom:14px;"><button data-t="round" class="${this.histTab==='round'?'active':''}">本輪（第 ${cls.round.roundNumber} 輪）</button><button data-t="all" class="${this.histTab==='all'?'active':''}">全部紀錄</button></div>`;

    if(rows.length===0){
      body.innerHTML = tabsHtml + `<div class="hist-empty">${this.histTab==='round'?'本輪尚未有抽籤紀錄':'尚未有任何紀錄'}</div>`;
      body.querySelectorAll('.tab-row button').forEach(b=> b.onclick=()=>{ this.histTab=b.dataset.t; this.renderHistory(); });
      return;
    }
    body.innerHTML = tabsHtml + `
      <div class="settings-actions-row" style="margin-bottom:14px;"><button class="btn danger" id="clearHistBtn">${icon('trash')} 清除全部紀錄</button></div>
      <table class="hist-table"><thead><tr><th>時間</th><th>對象</th><th>結果</th><th style="text-align:right;">分數</th></tr></thead><tbody>
        ${rows.map(h=>{
          const tagCls = h.result==='跳過' ? 'skip' : (h.result==='加分'||h.result==='減分') ? 'ok' : (h.result==='drawn' ? 'redraw' : 'ok');
          const resultText = h.result==='drawn' ? '抽中' : h.result;
          const ptsCls = h.points>0?'pos':h.points<0?'neg':'';
          return `<tr><td class="hist-time">${h.time}</td><td>${esc(h.label)}</td><td><span class="hist-tag ${tagCls}">${esc(resultText)}</span></td><td class="hist-pts ${ptsCls}">${h.points!==0 ? (h.points>0?'+':'')+h.points : '—'}</td></tr>`;
        }).join('')}
      </tbody></table>`;
    body.querySelectorAll('.tab-row button').forEach(b=> b.onclick=()=>{ this.histTab=b.dataset.t; this.renderHistory(); });
    document.getElementById('clearHistBtn').onclick = () => { cls.round.history = []; this.saveData(); this.renderHistory(); this.toast('紀錄已清除'); };
  },

  openSettings(){ this.renderSettingsNav(); this.renderSettingsPane(); this.openModal('modalSettings'); },

      <div class="add-row"><input type="text" id="newGroupName" placeholder="新小組名稱，例如：第${cls.groups.length+1}組"><button class="btn primary" id="addGroupBtn">${icon('plus')} 新增</button></div>`;
    const list = pane.querySelector('#groupList');
    list.innerHTML = cls.groups.map(g=>{
      const swatches = GROUP_PALETTE.map(c=>`<span class="swatch ${g.color===c?'active':''}" data-c="${c}" style="background:${c}"></span>`).join('');
      const count = cls.students.filter(s=>s.groupId===g.id).length;
      return `<div class="data-row" data-id="${g.id}" style="flex-direction:column;align-items:stretch;gap:8px;">
        <div style="display:flex;align-items:center;gap:10px;"><span class="color-dot" style="background:${g.color}"></span><input type="text" class="g-name" value="${esc(g.name)}" style="flex:1;"><span style="font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);">${count} 人</span><button class="row-icon-btn g-del">${icon('trash')}</button></div>
        <div class="swatch-row">${swatches}</div>
      </div>`;
    }).join('') || `<div class="mini-empty">尚未有小組</div>`;
    list.querySelectorAll('.data-row').forEach(row=>{
      const id = row.dataset.id;
      const g = cls.groups.find(x=>x.id===id);
      row.querySelector('.g-name').addEventListener('change', e=>{ g.name=e.target.value.trim()||g.name; this.saveData(); this.renderAll(); });
      row.querySelectorAll('.swatch').forEach(sw=> sw.addEventListener('click', ()=>{ g.color = sw.dataset.c; this.saveData(); this.renderSettingsPane(); this.renderAll(); }));
      row.querySelector('.g-del').addEventListener('click', ()=>{
        const c2 = this.activeClass();
        c2.groups = c2.groups.filter(x=>x.id!==id);
        c2.students.forEach(s=>{ if(s.groupId===id) s.groupId=null; });
        this.saveData(); this.renderSettingsPane(); this.renderAll(); this.layoutRing();
      });
    });
    pane.querySelector('#addGroupBtn').onclick = () => {
      const c2 = this.activeClass();
      const input = pane.querySelector('#newGroupName');
      const name = input.value.trim() || ('第'+(c2.groups.length+1)+'組');
      const color = GROUP_PALETTE[c2.groups.length % GROUP_PALETTE.length];
      c2.groups.push({ id:uid('g'), name, color });
      input.value='';
      this.saveData(); this.renderSettingsPane(); this.renderAll(); this.layoutRing();
    };
  },

  paneDraw(pane){
    const s = this.shared.settings;
    pane.innerHTML = `
      <h4>抽籤規則</h4>
      <p class="hint">此設定套用於所有班別。</p>
      <div class="toggle-row"><div><div class="t-label">避免連續重複</div><div class="t-desc">剛抽中的對象不會立即再被抽中</div></div><label class="switch"><input type="checkbox" id="tglAvoidRepeat" ${s.avoidRepeat?'checked':''}><span class="track"></span></label></div>
      <div class="toggle-row"><div><div class="t-label">只抽未回答學生</div><div class="t-desc">已獲得分數的學生暫不會被抽中</div></div><label class="switch"><input type="checkbox" id="tglOnlyUnanswered" ${s.onlyUnanswered?'checked':''}><span class="track"></span></label></div>
      <div class="toggle-row"><div><div class="t-label">允許手動排除</div><div class="t-desc">在學生資料彈窗中可暫時排除該學生</div></div><label class="switch"><input type="checkbox" id="tglExclude" ${s.allowManualExclude?'checked':''}><span class="track"></span></label></div>
      <div class="toggle-row"><div><div class="t-label">音效</div><div class="t-desc">抽籤時播放輕微音效</div></div><label class="switch"><input type="checkbox" id="tglSound" ${s.soundOn?'checked':''}><span class="track"></span></label></div>
      <div class="field" style="margin-top:16px;"><label>抽籤動畫速度</label><select id="selAnimSpeed"><option value="fast" ${s.animSpeed==='fast'?'selected':''}>快速</option><option value="normal" ${s.animSpeed==='normal'?'selected':''}>正常</option><option value="slow" ${s.animSpeed==='slow'?'selected':''}>較慢（更有懸念）</option></select></div>
      <div class="field"><label>事件卡出現機率</label><select id="selEventFreq"><option value="low" ${s.eventFrequency==='low'?'selected':''}>較低</option><option value="medium" ${s.eventFrequency==='medium'?'selected':''}>中等</option><option value="high" ${s.eventFrequency==='high'?'selected':''}>較高</option></select><p class="hint" style="margin:8px 0 0;">已啟用的事件卡會混入「抽學生」的輪盤中，有機會被抽中。</p></div>
      <div class="field"><label>高分減少中籤機率</label><p class="hint" style="margin:0;">分數越高，被抽中的機率會稍為下降，但保證不會降至零，已自動套用於「抽學生」模式。</p></div>`;
    pane.querySelector('#tglAvoidRepeat').addEventListener('change', e=>{ s.avoidRepeat=e.target.checked; this.saveShared(); });
    pane.querySelector('#tglOnlyUnanswered').addEventListener('change', e=>{ s.onlyUnanswered=e.target.checked; this.saveShared(); });
    pane.querySelector('#tglExclude').addEventListener('change', e=>{ s.allowManualExclude=e.target.checked; this.saveShared(); });
    pane.querySelector('#tglSound').addEventListener('change', e=>{ s.soundOn=e.target.checked; this.saveShared(); });
    pane.querySelector('#selAnimSpeed').addEventListener('change', e=>{ s.animSpeed=e.target.value; this.saveShared(); });
    pane.querySelector('#selEventFreq').addEventListener('change', e=>{ s.eventFrequency=e.target.value; this.saveShared(); });
  },

  paneChallenges(pane){
    pane.innerHTML = `
      <h4>課堂任務庫</h4>
      <p class="hint">用於「抽任務」模式，所有班別共用，可隨堂新增或停用。</p>
      <div class="data-list" id="challengeList"></div>
      <div class="add-row"><input type="text" id="newChallengeText" placeholder="新增任務內容…"><button class="btn primary" id="addChallengeBtn">${icon('plus')} 新增</button></div>`;
    const list = pane.querySelector('#challengeList');
    list.innerHTML = this.shared.challenges.map(c=>`<div class="data-row" data-id="${c.id}"><input type="checkbox" class="row-check c-en" ${c.enabled?'checked':''}><input type="text" class="c-text" value="${esc(c.text)}"><button class="row-icon-btn c-del">${icon('trash')}</button></div>`).join('') || `<div class="mini-empty">尚未有任務</div>`;
    list.querySelectorAll('.data-row').forEach(row=>{
      const id = row.dataset.id;
      const c = this.shared.challenges.find(x=>x.id===id);
      row.querySelector('.c-en').addEventListener('change', e=>{ c.enabled=e.target.checked; this.saveShared(); });
      row.querySelector('.c-text').addEventListener('change', e=>{ c.text=e.target.value.trim()||c.text; this.saveShared(); });
      row.querySelector('.c-del').addEventListener('click', ()=>{ this.shared.challenges=this.shared.challenges.filter(x=>x.id!==id); this.saveShared(); this.renderSettingsPane(); });
    });
    pane.querySelector('#addChallengeBtn').onclick = () => {
      const input = pane.querySelector('#newChallengeText');
      const text = input.value.trim();
      if(!text) return;
      this.shared.challenges.push({ id:uid('c'), text, enabled:true });
      input.value='';
      this.saveShared(); this.renderSettingsPane();
    };
  },

  paneEvents(pane){
    pane.innerHTML = `
      <h4>事件卡</h4>
      <p class="hint">所有班別共用。已啟用的事件卡會混入「抽學生」輪盤中，有機會被抽中；亦可透過「快速操作→事件卡」隨時手動觸發。</p>
      <div class="data-list" id="eventList"></div>
      <div class="field" style="margin-top:10px;"><label>新增事件卡</label>
        <div style="display:flex;gap:8px;"><input type="text" id="newEventIcon" placeholder="Emoji" style="width:64px;background:var(--paper-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:9px;padding:9px;text-align:center;"><input type="text" id="newEventTitle" placeholder="標題" style="flex:1;background:var(--paper-2);border:1px solid var(--line-strong);color:var(--ink);border-radius:9px;padding:9px 11px;"></div>
        <textarea id="newEventDesc" placeholder="說明文字…" style="margin-top:8px;"></textarea>
        <button class="btn primary block" id="addEventBtn" style="margin-top:8px;">${icon('plus')} 新增事件卡</button>
      </div>`;
    const list = pane.querySelector('#eventList');
    list.innerHTML = this.shared.eventCards.map(e=>`
      <div class="data-row" data-id="${e.id}" style="align-items:flex-start;">
        <input type="checkbox" class="row-check e-en" ${e.enabled?'checked':''} style="margin-top:10px;">
        <div style="flex:1;">
          <div style="display:flex;gap:8px;margin-bottom:6px;"><span style="font-size:18px;">${esc(e.icon||'🎫')}</span><input type="text" class="e-title" value="${esc(e.title)}" style="flex:1;background:var(--paper);border:1px solid var(--line-strong);border-radius:7px;padding:6px 8px;color:var(--ink);font-weight:700;font-size:13px;"></div>
          <textarea class="e-desc" style="width:100%;background:var(--paper);border:1px solid var(--line-strong);border-radius:7px;padding:6px 8px;color:var(--ink-dim);font-size:12.5px;min-height:40px;">${esc(e.desc)}</textarea>
        </div>
        <button class="row-icon-btn e-del" style="margin-top:10px;">${icon('trash')}</button>
      </div>`).join('') || `<div class="mini-empty">尚未有事件卡</div>`;
    list.querySelectorAll('.data-row').forEach(row=>{
      const id = row.dataset.id;
      const e = this.shared.eventCards.find(x=>x.id===id);
      row.querySelector('.e-en').addEventListener('change', ev=>{ e.enabled=ev.target.checked; this.saveShared(); this.renderRing(); });
      row.querySelector('.e-title').addEventListener('change', ev=>{ e.title=ev.target.value.trim()||e.title; this.saveShared(); this.renderRing(); });
      row.querySelector('.e-desc').addEventListener('change', ev=>{ e.desc=ev.target.value.trim(); this.saveShared(); });
      row.querySelector('.e-del').addEventListener('click', ()=>{ this.shared.eventCards=this.shared.eventCards.filter(x=>x.id!==id); this.saveShared(); this.renderSettingsPane(); this.renderRing(); });
    });
    pane.querySelector('#addEventBtn').onclick = () => {
      const iconV = pane.querySelector('#newEventIcon').value.trim() || '🎫';
      const title = pane.querySelector('#newEventTitle').value.trim();
      const desc = pane.querySelector('#newEventDesc').value.trim();
      if(!title) return;
      this.shared.eventCards.push({ id:uid('e'), icon:iconV, title, desc, enabled:true });
      this.saveShared(); this.renderSettingsPane(); this.renderRing();
    };
  },

  paneData(pane){
    const googleSection = this.renderGoogleSyncSection();
    pane.innerHTML = `
      <h4>資料與同步</h4>
      ${IN_CLAUDE_ENV ? `
      <div class="storage-note">${icon('cloudCheck')} <b>自動雲端儲存已啟用。</b> 所有班別、學生、分數與紀錄會即時自動儲存，並在你下次以同一帳戶開啟本工具時自動還原 —— 不需要手動登入 Google 帳戶或按任何儲存按鈕。（注意：這是 Claude 內建的雲端儲存，並非串接 Google 帳戶；若需要匯出成獨立檔案，請使用下方「匯出」功能。）</div>
      ` : ''}
      ${googleSection}
      <div class="field"><label>匯出／備份</label><div class="settings-actions-row"><button class="btn w-auto" id="exportBtn">${icon('download')} 匯出 JSON</button><button class="btn w-auto" id="importBtn">${icon('upload')} 匯入 JSON</button><input type="file" id="importFile" accept="application/json" style="display:none;"></div></div>
      <div class="field"><label>重置</label><div class="settings-actions-row"><button class="btn danger w-auto" id="resetRoundBtn2">${icon('refresh')} 重置本輪</button><button class="btn danger w-auto" id="fullResetBtn">${icon('trash')} 清除全部資料並套用示範班別</button></div></div>
      <div class="field">
        <label>版本紀錄 · 目前 ${APP_VERSION}</label>
        <div class="data-list">
          ${APP_CHANGELOG.map(c=>`<div class="data-row" style="align-items:flex-start;"><span style="font-family:var(--font-mono);font-weight:800;color:var(--gold-dark);flex:0 0 auto;">${esc(c.v)}</span><span style="color:var(--ink-dim);font-size:12.5px;">${esc(c.notes)}</span></div>`).join('')}
        </div>
      </div>`;
    pane.querySelector('#exportBtn').onclick = () => {
      const payload = { data:this.data, shared:this.shared };
      const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = '課堂控制台-備份.json';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      this.toast('已匯出 JSON 檔案');
    };
    pane.querySelector('#importBtn').onclick = () => pane.querySelector('#importFile').click();
    pane.querySelector('#importFile').addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const payload = JSON.parse(reader.result);
          if(payload.data) this.data = payload.data;
          if(payload.shared) this.shared = payload.shared;
          if(!this.data.classes.find(c=>c.id===this.data.activeClassId)) this.data.activeClassId = this.data.classes[0].id;
          this.saveData(); this.saveShared();
          this.renderAll(); this.layoutRing(); this.renderSettingsPane();
          this.toast('匯入成功');
        }catch(err){ this.toast('匯入失敗：檔案格式錯誤', true); }
      };
      reader.readAsText(file);
    });
    pane.querySelector('#resetRoundBtn2').onclick = () => this.resetRound();
    pane.querySelector('#fullResetBtn').onclick = () => { if(confirm('確定要清除全部資料並套用示範班別嗎？此操作無法復原。')) this.fullReset(); };

    const gBtn = pane.querySelector('#gConnectBtn');
    if(gBtn) gBtn.onclick = async () => { await this.connectGoogle(); this.renderSettingsPane(); };
    const gOut = pane.querySelector('#gDisconnectBtn');
    if(gOut) gOut.onclick = () => { this.disconnectGoogle(); this.renderSettingsPane(); };
  },

  renderGoogleSyncSection(){
    if(IN_CLAUDE_ENV){
      return `<div class="field">
        <label>Google 雲端硬碟同步</label>
        <p class="hint" style="margin:0;">這是給你日後把本檔案下載、自行架設在自己網站上使用的進階選項——在 Claude.ai 預覽環境內無法連接 Google（瀏覽器安全機制不允許），此處不會顯示任何設定；下載後在原始碼最上方搜尋 <code>GOOGLE_CLIENT_ID</code> 填入你自己申請的 OAuth 用戶端 ID 即可啟用。</p>
      </div>`;
    }
    if(!GDrive.configured()){
      return `<div class="field">
        <label>Google 雲端硬碟同步</label>
        <div class="storage-note" style="background:var(--gold-dim);border-color:rgba(227,168,60,0.35);">
          ${icon('cloud')} <b>尚未設定。</b> 請在原始碼中找到 <code>const GOOGLE_CLIENT_ID = '';</code> 這一行，
          貼入你在 <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener">Google Cloud Console</a> 建立的 OAuth 2.0 用戶端 ID，
          並確認該用戶端的「已授權的 JavaScript 來源」與這個檔案實際架設的網址完全相符，儲存後重新整理頁面即可。
        </div>
      </div>`;
    }
    if(GDrive.signedIn){
      return `<div class="field">
        <label>Google 雲端硬碟同步</label>
        <div class="storage-note">${icon('cloudCheck')} <b>已連接 Google 帳戶。</b> 班別、學生、分數與紀錄會自動儲存到你 Google 雲端硬碟的私人應用程式資料夾（不會出現在你一般的雲端硬碟畫面中）。瀏覽器安全性限制下，重新整理頁面後可能需要再次登入一次。</div>
        <div class="settings-actions-row"><button class="btn danger w-auto" id="gDisconnectBtn">${icon('x')} 登出 Google 帳戶</button></div>
      </div>`;
    }
    return `<div class="field">
      <label>Google 雲端硬碟同步</label>
      <div class="storage-note" style="background:var(--red-dim);border-color:rgba(226,82,77,0.3);">${icon('cloud')} <b>尚未連接。</b> 登入後，資料會自動儲存到你自己的 Google 雲端硬碟，不需要再手動按儲存。</div>
      <div class="settings-actions-row"><button class="btn primary w-auto" id="gConnectBtn">${icon('cloudCheck')} 使用 Google 帳戶登入</button></div>
    </div>`;
  },

  initAudio(){ if(!this.shared.settings.soundOn) return; if(!this.audioCtx){ try{ this.audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.audioCtx=null; } } },
  playTick(){
    if(!this.shared.settings.soundOn || !this.audioCtx) return;
    try{
      const ctx = this.audioCtx;
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='square'; o.frequency.value = 720;
      g.gain.value = 0.035;
      o.connect(g); g.connect(ctx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.05);
      o.stop(ctx.currentTime+0.06);
    }catch(e){}
  },
  playChime(){
    if(!this.shared.settings.soundOn || !this.audioCtx) return;
    try{
      const ctx = this.audioCtx;
      [880, 1174.7].forEach((f,i)=>{
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type='sine'; o.frequency.value=f;
        g.gain.value=0.0001;
        o.connect(g); g.connect(ctx.destination);
        const t0 = ctx.currentTime + i*0.09;
        o.start(t0);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.09, t0+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+0.35);
        o.stop(t0+0.38);
      });
    }catch(e){}
  },

  toast(msg, warn){
    const t = document.createElement('div');
    t.className = 'toast' + (warn?' warn':'');
    t.innerHTML = icon(warn?'x':'check') + '<span>'+esc(msg)+'</span>';
    this.els.toastStack.appendChild(t);
    setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(6px)'; t.style.transition='all .2s ease'; setTimeout(()=>t.remove(),220); }, 2400);
  },
};

App.saveData = debounce(()=>App._doSaveData(), 450);
App.saveShared = debounce(()=>App._doSaveShared(), 450);

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
